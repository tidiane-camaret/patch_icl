[project]
name = "patch-icl"
version = "0.1.0"
description = "patch-based icl on images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Scientific stack
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "scikit-image>=0.24",
    # Config / experiment
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "wandb>=0.19",
    # Medical imaging / data
    "nibabel>=5.2",
    "huggingface_hub>=0.23",
    # Visualisation / utilities
    "matplotlib>=3.9",
    "pillow>=10.0",
    "tqdm>=4.66",
    "psutil>=6.0",
    # nnUNet (ResEncEncoder + dynamic_network_architectures) — pulls torch transitively
    "nnunetv2>=2.5",
    "pytorch-lightning>=2.6.4",
    "tabulate>=0.10.0",
    "monai>=1.5.2",
    "marimo>=0.23.14",
]

# Pick exactly one of these at sync time:
#   uv sync --extra cu121   # Ampere w/ older driver (CUDA 12.3, e.g. thor RTX A6000)
#   uv sync --extra cu124   # older Ampere/Hopper boxes (driver CUDA >=12.4, e.g. nero)
#   uv sync --extra cu128   # Blackwell (sm_120, e.g. RTX PRO 6000)
#   uv sync --extra cpu     # laptop / CI
[project.optional-dependencies]
cu121 = ["torch>=2.5.1", "torchvision>=0.20.0"]
cu124 = ["torch>=2.5.1", "torchvision>=0.20.0"]
cu128 = ["torch>=2.5.1", "torchvision>=0.20.0"]
cpu   = ["torch>=2.5.1", "torchvision>=0.20.0"]

[tool.uv]
conflicts = [
    [
        { extra = "cu121" },
        { extra = "cu124" },
        { extra = "cu128" },
        { extra = "cpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", extra = "cu121" },
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cpu",   extra = "cpu"   },
]
torchvision = [
    { index = "pytorch-cu121", extra = "cu121" },
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cpu",   extra = "cpu"   },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
