# @package _global_
# 147_cascade_randomfg_predprior_regon — coarse-to-fine ablation, STEP 3 (final) of 3.
# Adds ONE change on top of 146: cascade registers. See 145's own header for the full
# ordering rationale and CASCADE LADDER/CENTER MODE notes (unchanged here).
#
#   145  registers=off, prior=perturbed-GT, center=random_fg
#   146  145 + prior=real prev.pred
#   147 (this)  146 + registers=on   -- all three mechanisms active
#
#   python experiments/3d/train.py experiment=147_cascade_randomfg_predprior_regon
#
# REGISTERS (this step): `arch.cascade_registers=true` -- carries level i-1's pooled
# thinking-row output into level i via a learned `cascade_proj`/`cascade_type` prefix
# (src/models/patchset3d.py). Added LAST because it's already baked into 135b's
# checkpoint architecture (structurally free -- 135b's weights already carry
# `cascade_proj`/`cascade_type`, just inert until real cascade training activates them),
# unlike the two data/geometry swaps in 145/146 which needed to be introduced and
# isolated first. `checkpoint_allow_partial: false` (strict, full-shape load -- identical
# arch to 135b, no dropped/added params this time).

defaults:
  - /encoder: e4_plainconv_ts
  - override /dataset: multisource_ct_mri
  - override /model: m2_patchset_decoder
  - override /augmentations: calibrated
  - _self_

arch:
  plainconv_ts_features_per_stage: [32, 64, 256, 512]
  nnunet_ts_stages: [2, 3]
  encoder_input_norm: instance
  encoder_spacing_aware: true
  compile_dynamic: false
  mask_slots: 1
  decode_source: img
  mask_embed: linear
  cascade_registers: true   # NEW (this step, final) -- see REGISTERS note above
  pool_token: true

data:
  train_spacing_range: null      # was [3, 6] -- mutually exclusive with cascade_spacings
  crop_spacing_mm: 4             # was 4.24 -- must == cascade_spacings[0]
  cascade_spacings: [4, 1.5]     # fixed ladder for eval / periodic val-during-train
  cascade_train:                 # randomized 2-level TRAIN ladder
    levels: 2
    spacing_range: [1, 6]
  cascade_query_prior: pred      # unchanged from 146
  cascade_center_mode:            # unchanged from 145/146
    mode: random_fg
    eval_mode: com
  gpu_realize_crop: true
  ram_cache: true
  p_synth: 0                     # train sweep uses REAL anatomy only -- see 145's WHY note
  gpu_realize_max_native: 128
  source_mix:
    per_source_train_classes: [balanced, balanced]
    regime_p: [0.5, 0.5, 0.0]
    eval_epoch_length: 800
  # data.query_prior / data.prior_perturb intentionally absent -- see 146's QUERY PRIOR note.

augmentations:
  task:
    affine: {p: 0.5, scale_min: 1, scale_max: 1}
    elastic: {p: 0}
    deform: {p: 0}
    mask_interp: bilinear
  per_image:
    affine: {p: 0.2}
    elastic: {p: 0}
    deform: {p: 0}
    mask_interp: bilinear
  goal_mask:
    p: 0.4
    ops: [dilate, erode, boundary, sobel]

train:
  epochs: 60
  batch_size: 4
  eval_every: 20
  workers: 12
  grad_clip: 1.0
  profile_timing: true
  drop_last: true

  lr: 7.1e-5
  encoder_lr_scale: 1
  warmup_epochs: 1
  cascade_loss_weights: [1, 1]
  checkpoint: /nfs/data/nii/data1/Analysis/camaret___in_context_segmentation/ANALYSIS_20251122/results/patch_icl/3d_train/2026-09-23_135b_varspacing_synth05_shape1_intensitycalib_continue/best.pt
  checkpoint_allow_partial: false   # identical arch to 135b -- strict full-shape load
  resume_weights_only: true

eval:
  split: val
  n_subjects: null
  tasks_per_class: 10
  crop_jitter: 0

wandb:
  name: 147_cascade_randomfg_predprior_regon
