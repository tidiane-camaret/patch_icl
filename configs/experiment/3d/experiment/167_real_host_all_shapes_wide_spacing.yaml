# @package _global_
# 167_real_host_all_shapes_wide_spacing -- continues 166 (docs/logs.md 2026-09-27), per user
# direction "add the other synthetic shapes, spacing 6 to 1.5, 400 epochs, eval every 20". Two
# changes vs. 166:
#
#   1. `data.gmm.real_host_families` now lists ALL 7 shape families (blob, splatter, disk,
#      cylinder, scatter_field, vessel, torus), not just scatter_field -- every shape-mode task
#      now bypasses the gmm_bank entirely and is stamped onto the same real CT+MRI mixed,
#      all-organ host pool 166 already validated. `family_weights` is unchanged (scatter_field
#      still 4x the others), so the RELATIVE frequency of each shape type is the same as
#      before -- only the CANVAS every one of them uses is now real, not just scatter_field's.
#   2. `data.train_spacing_range: [1.5, 6]` (was `[3, 6]`) -- widens the per-batch spacing sweep
#      down to 1.5mm, matching ISLES22/Shifts-MS's own real eval pitch directly. Note this
#      affects the REAL (non-synth) organ tasks and any remaining non-real-hosted synth draws;
#      since ALL shape families are real-hosted now (see #1), RealHostShapeProvider's own FIXED
#      1.0mm pitch (independent of train_spacing_range, see its docstring) is untouched by this
#      -- the widened range's effect is entirely on the real-organ half of training.
#      `crop_spacing_mm` updated to 3.0 (= sqrt(1.5*6), the geometric-mean convention 135b's own
#      4.24 = sqrt(3*6) already established) for consistency.
#
#   python experiments/3d/train.py experiment=167_real_host_all_shapes_wide_spacing
#
# CHECKPOINT: continues 166's own best.pt (stopped early at epoch 6 for the "eval last
# checkpoint" check -- still the most recent state, negligible drift from 165 at that point).
#
# BUDGET: epochs=400 (the longest commitment yet), eval_every=20 (20 in-training eval passes
# across the run). Validate with small real-OOD slices + eval_pshape_families.py per the
# established fast-iteration approach.

defaults:
  - /encoder: e4_plainconv_ts
  - override /dataset: multisource_ct_mri
  - override /model: m2_patchset_decoder
  - override /augmentations: calibrated
  - _self_

arch:
  plainconv_ts_features_per_stage: [32, 64, 256, 512]
  nnunet_ts_stages: [2, 3]
  encoder_input_norm: instance
  encoder_spacing_aware: true
  compile_dynamic: false
  mask_slots: 1
  decode_source: img
  mask_embed: linear
  cascade_registers: true
  pool_token: true

data:
  train_spacing_range: [1.5, 6]   # NEW -- was [3, 6]
  crop_spacing_mm: 3.0            # NEW -- geometric mean of the new range (was 4.24)
  gpu_realize_crop: true
  ram_cache: true
  p_synth: 0.5
  gpu_realize_max_native: 128
  gmm:
    paint_mask_aligned: true
    var_max: 80
    background_mode: zero
    mu_group_ids: merged
    mu_group_rho: null
    sd_between_ratio: ct_mri
    sd_group_ids: merged
    sd_group_rho: null
    p_shape: 1.0
    real_host_families: [blob, splatter, disk, cylinder, scatter_field, vessel, torus]  # NEW -- was [scatter_field] only
    real_host_cls: all                    # MRI side -- all real MRI classes (165)
    real_host_include_ct: true            # CT side also mixed in (166)
    real_host_ct_cls: all
    real_host_ct_weight: 1.0              # 1:1 with the MRI provider -> ~50/50 modality mix
    shape:
      host_anchored: true
      family_weights: {blob: 1.0, splatter: 1.0, disk: 1.0, cylinder: 1.0,
                       scatter_field: 4.0}
    texture:
      n_octaves: 4
    p_heterogeneity: 0.3
    heterogeneity:
      core_fraction: 0.35
      core_offset_ratio: 0.8
      sigma1_range: [1.0, 4.0]
      sigma2_range: [0.5, 2.0]
  cohort:
    w_by_class_size: 1
    randomness: 1
    by_class_size_common_frac: 0.75
    by_class_size_mode: fraction
    exclude_src: [TotalSegmentatorV2]
  source_mix:
    per_source_train_classes: [balanced, balanced]
    regime_p: [0.5, 0.5, 0.0]
    eval_epoch_length: 800

  query_prior:
    modes: [gt, none]
    p: [0.3, 0.7]
  prior_perturb:
    p: 1.0
    ball: false
    dilate_mm: [2.0, 8.0]
    erode_mm:  [2.0, 8.0]
    erode_min_keep: 0.15
    shift_mm:  [4.0, 12.0]
    noise_std: [0.15, 0.4]

augmentations:
  task:
    affine: {p: 0.5, scale_min: 1, scale_max: 1}
    elastic: {p: 0}
    deform: {p: 0.2, control_points: 6, max_disp: 0.15, num_steps: 6}
    mask_interp: bilinear
  per_image:
    affine: {p: 0.2}
    elastic: {p: 0}
    deform: {p: 0}
    mask_interp: bilinear
  goal_mask:
    p: 0.4
    ops: [dilate, erode, boundary, sobel]

train:
  epochs: 400
  batch_size: 8
  eval_every: 20
  workers: 12
  grad_clip: 1.0
  profile_timing: true
  drop_last: true

  lr: 1.0e-4
  encoder_lr_scale: 1
  warmup_epochs: 1
  checkpoint: /nfs/data/nii/data1/Analysis/camaret___in_context_segmentation/ANALYSIS_20251122/results/patch_icl/3d_train/2026-09-27_166_real_host_mixed_ct_mri_overnight/best.pt
  checkpoint_allow_partial: false   # identical arch to 166 -- strict full-shape load
  resume_weights_only: true

eval:
  split: val
  n_subjects: null
  tasks_per_class: 10
  crop_jitter: 0

wandb:
  name: 167_real_host_all_shapes_wide_spacing
