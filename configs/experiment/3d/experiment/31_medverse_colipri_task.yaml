# @package _global_
# Experiment 31 — Medverse on the exp-30 CoLiPri *task*, at Medverse's native 128³.
# The medverse twin of experiment=30_colipri_encoder: identical data selection + optim
# recipe, but swaps the frozen-CoLiPri PatchSet3D for the released Medverse U-Net running
# at 128³ (level=1, no AR).
#
# Task-matching decisions (see docs/logs.md 2026-07-29):
#   - input size 128³ (Medverse native) instead of 192³.
#   - crop_spacing_mm=2 held constant → FOV = 128·2 = 256mm @ 2mm/voxel. Same voxel
#     resolution as the patchset3d run (which had 384mm FOV at 192³), a smaller body crop.
#   - loss = bce_dice (plain BCE + soft-Dice on the [0,1] output). Medverse's native
#     smooth_l1 (SmoothL3L1 regression) COLLAPSES here: TotalSeg organs occupy <1% of the
#     128³/256mm volume, so a per-voxel regression loss barely distinguishes a good mask from
#     all-background (no foreground gradient) and finetuning drifts to background — val dice
#     fell from zero-shot ~0.17 to 0.04 in one epoch. The soft-Dice term is imbalance-robust
#     (same term that makes patchset3d's bce_dice work). See docs/logs.md 2026-07-29.
#   - optim = Medverse-native Adam(3e-5), no weight decay (gentle finetune of pretrained
#     weights), instead of exp30's AdamW(1e-4, wd 0.01). Scheduler kept as exp30's cosine.
#     Medverse output is already a [0,1] probability (no output activation) — build_loss's
#     bce_dice uses plain binary_cross_entropy (NOT with_logits) for it. See docs/logs.md.
#   - init = released Medverse weights (checkpoint=orig_weights, fine-tune).
#   - train_classes=all, val_classes=all (matches the patchset3d run's `train_classes=all`
#     override of exp30's `benchmark`).
#
# Run with (no extra overrides needed — the exp30 CLI overrides are baked in here):
#   python experiments/3d/train.py experiment=31_medverse_colipri_task
defaults:
  - override /model: medverse
  - override /dataset: totalseg
  - override /augmentations: nnunet

data:
  image_size: [128, 128, 128]
  use_crop: true
  crop_spacing_mm: 2
  max_ds_len_train: 1000
  train_classes: all
  val_classes: all
  synth_method: null
  p_synth: 0
  class_balanced: false

train:
  epochs: 1000
  batch_size: 1          # exp30 used bs=1 (forced by 192³ patchset memory); at 128³ Medverse
                         # has headroom — raise with train.batch_size=N if you want throughput.
  checkpoint: orig_weights
  optimizer: adam        # Medverse-native: Adam, lr 3e-5, no weight decay (gentle finetune)
  lr: 3.0e-5
  weight_decay: 0.0
  scheduler: cosine
  warmup_epochs: 1
  loss: bce_dice         # plain BCE + soft-Dice on the [0,1] output; Dice term = imbalance-robust
  dice_weight: 1.0
  oob_weight: 10.0       # out-of-bounds anchor: penalize output outside [0,1]. REQUIRED for
                         # medverse — its unbounded conv head + the loss's clamp otherwise let the
                         # raw output diverge to ~1e24 and overflow to NaN. See docs/logs.md 2026-07-29.

eval:
  split: test
  n_subjects: 20
