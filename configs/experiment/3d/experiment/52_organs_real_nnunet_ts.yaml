# @package _global_
# 52_organs_real_nnunet_ts — the REAL-data twin of 50_abdomen_synth_nnunet_ts and the
# nnU-Net-encoder counterpart of 48_abdomen_ceiling. Frozen TotalSegmentator nnU-Net image
# encoder + PatchSet3D head, but here TRAIN and VAL are both real cross-subject TotalSeg
# tasks (loader_v2, no GMM synth) — "how well does the frozen supervised-CT organ encoder
# transfer in-context on real scans of the classes it was trained on?".
#
#   python experiments/3d/train.py experiment=52_organs_real_nnunet_ts
#
# Two changes vs the 48 real ceiling:
#   1. encoder e1 (CoLiPri Primus) -> e2 (frozen nnU-Net PlainConvUNet), pointed at the v2
#      Dataset291 part1_organs model (1.5 mm) instead of e2's default Dataset297 total (3 mm).
#      NnUNetTSEncoder auto-derives out_ch / channel dims / pretrain spacing from that model's
#      own plans.json + dataset.json, so only the weights path needs overriding here.
#   2. crop_spacing_mm 2 -> 1.5 to match the organ encoder's 1.5 mm pretrain pitch, so the
#      frozen conv's receptive fields see in-distribution structure (train + eval; eval always
#      uses data.crop_spacing_mm here since d1 has no data.val override).
#
# Classes are restricted to the v2 part1_organs list the encoder was trained on (24 classes),
# minus kidney_cyst_left/right (pathology, ~absent from standard label.npy -> zero-Dice noise)
# -> 22 real organ classes for both train and val.
defaults:
  - 48_abdomen_ceiling
  - override /encoder: e2
  - _self_

arch:
  # v2 organ (part1) 1.5 mm weights. Downloaded from
  #   https://github.com/wasserth/TotalSegmentator/releases/download/v2.0.0-weights/Dataset291_TotalSegmentator_part1_organs_1559subj.zip
  # NOTE: this path must match wherever the unpacked model lives under paths.totalseg_nnunet
  # (parallel to the existing Dataset297_total_3mm/3d_fullres). Rename on unpack if needed.
  nnunet_ts_weights: ${paths.totalseg_nnunet}/Dataset291_organs_1.5mm/3d_fullres

data:
  # 1.5 mm crops = encoder pretrain pitch (train + eval).
  crop_spacing_mm: 1.5
  train_spacing_range: null
  # v2 part1_organs class list (24) minus kidney_cyst_left/right -> 22 real organ classes.
  train_classes: [spleen, kidney_right, kidney_left, gallbladder, liver, stomach, pancreas,
                  adrenal_gland_right, adrenal_gland_left, lung_upper_lobe_left,
                  lung_lower_lobe_left, lung_upper_lobe_right, lung_middle_lobe_right,
                  lung_lower_lobe_right, esophagus, trachea, thyroid_gland, small_bowel,
                  duodenum, colon, urinary_bladder, prostate]
  val_classes:   [spleen, kidney_right, kidney_left, gallbladder, liver, stomach, pancreas,
                  adrenal_gland_right, adrenal_gland_left, lung_upper_lobe_left,
                  lung_lower_lobe_left, lung_upper_lobe_right, lung_middle_lobe_right,
                  lung_lower_lobe_right, esophagus, trachea, thyroid_gland, small_bowel,
                  duodenum, colon, urinary_bladder, prostate]

wandb:
  name: 52_organs_real_nnunet_ts
