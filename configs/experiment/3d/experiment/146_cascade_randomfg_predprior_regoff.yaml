# @package _global_
# 146_cascade_randomfg_predprior_regoff — coarse-to-fine ablation, STEP 2 of 3. Adds ONE
# change on top of 145: query-prior source. See 145's own header for the full ordering
# rationale, CASCADE LADDER note, and CENTER MODE note (all unchanged here).
#
#   145  registers=off, prior=perturbed-GT, center=random_fg
#   146 (this)  145 + prior=real prev.pred
#   147         146 + registers=on
#
#   python experiments/3d/train.py experiment=146_cascade_randomfg_predprior_regoff
#
# QUERY PRIOR (this step): `cascade_query_prior: pred` (scalar -- train == eval, both the
# real cascade: sigmoid(logit_{i-1}), detached, M2-warped onto level i's grid). Drops
# `prior_perturb` entirely (unlike 145's gt_coarse cell): the real prediction is already
# imperfect, and adding synthetic noise on top would confound the "perturbed-GT vs
# real-pred" comparison this step isolates.
#
# REGISTERS: `arch.cascade_registers=false`, unchanged from 145 (still not active --
# added last, in 147). `checkpoint_allow_partial: true` unchanged for the same reason.

defaults:
  - /encoder: e4_plainconv_ts
  - override /dataset: multisource_ct_mri
  - override /model: m2_patchset_decoder
  - override /augmentations: calibrated
  - _self_

arch:
  plainconv_ts_features_per_stage: [32, 64, 256, 512]
  nnunet_ts_stages: [2, 3]
  encoder_input_norm: instance
  encoder_spacing_aware: true
  compile_dynamic: false
  mask_slots: 1
  decode_source: img
  mask_embed: linear
  cascade_registers: false   # unchanged from 145 -- added last, in 147
  pool_token: true

data:
  train_spacing_range: null      # was [3, 6] -- mutually exclusive with cascade_spacings
  crop_spacing_mm: 4             # was 4.24 -- must == cascade_spacings[0]
  cascade_spacings: [4, 1.5]     # fixed ladder for eval / periodic val-during-train
  cascade_train:                 # randomized 2-level TRAIN ladder
    levels: 2
    spacing_range: [1, 6]
  cascade_query_prior: pred      # NEW (this step): real previous-level prediction
  cascade_center_mode:            # unchanged from 145
    mode: random_fg
    eval_mode: com
  gpu_realize_crop: true
  ram_cache: true
  p_synth: 0                     # train sweep uses REAL anatomy only -- see 145's WHY note
  gpu_realize_max_native: 128
  source_mix:
    per_source_train_classes: [balanced, balanced]
    regime_p: [0.5, 0.5, 0.0]
    eval_epoch_length: 800
  # data.query_prior / data.prior_perturb intentionally absent -- see QUERY PRIOR note above.

augmentations:
  task:
    affine: {p: 0.5, scale_min: 1, scale_max: 1}
    elastic: {p: 0}
    deform: {p: 0}
    mask_interp: bilinear
  per_image:
    affine: {p: 0.2}
    elastic: {p: 0}
    deform: {p: 0}
    mask_interp: bilinear
  goal_mask:
    p: 0.4
    ops: [dilate, erode, boundary, sobel]

train:
  epochs: 60
  batch_size: 4
  eval_every: 20
  workers: 12
  grad_clip: 1.0
  profile_timing: true
  drop_last: true

  lr: 7.1e-5
  encoder_lr_scale: 1
  warmup_epochs: 1
  cascade_loss_weights: [1, 1]
  checkpoint: /nfs/data/nii/data1/Analysis/camaret___in_context_segmentation/ANALYSIS_20251122/results/patch_icl/3d_train/2026-09-23_135b_varspacing_synth05_shape1_intensitycalib_continue/best.pt
  checkpoint_allow_partial: true   # cascade_registers=false drops cascade_proj/cascade_type
  resume_weights_only: true

eval:
  split: val
  n_subjects: null
  tasks_per_class: 10
  crop_jitter: 0

wandb:
  name: 146_cascade_randomfg_predprior_regoff
