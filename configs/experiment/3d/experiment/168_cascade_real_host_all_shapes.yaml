# @package _global_
# 168_cascade_real_host_all_shapes -- switches the 160-167 real-host synthetic-shape
# lineage into cascade mode, resuming 167's own checkpoint (e320/400, val_dice=0.4902,
# the best in-distribution AND best gnc_kidney checkpoint of the whole sweep -- see
# docs/logs.md 2026-09-28). Combines two things that have never been trained together
# before: 167's real-host shape mechanism (p_synth=0.5, all 7 families, real CT+MRI
# hosts, all organs) and cascade coarse-to-fine training, using 146's validated cascade
# recipe (145/146/147 chain, see docs/logs.md and PERFORMANCE_ANALYSIS.md §3) as the
# template for every cascade-specific setting.
#
#   python experiments/3d/train.py experiment=168_cascade_real_host_all_shapes
#
# TWO DECISIONS, made explicitly (not silently copied from 146), per user direction:
#
# 1. DATA RECIPE: kept 167's p_synth=0.5 real-host mechanism ACTIVE (data.gmm.* block
#    copied unchanged from 167), rather than resetting to 145-147's p_synth=0
#    ("real anatomy only, isolate the cascade mechanism" -- their own deliberate choice
#    for that ablation). The whole point of resuming from 167 specifically (not 135b) is
#    to keep its real-host training going -- resetting p_synth=0 would make that choice
#    moot. Verified code-supported, not just assumed: `RealHostShapeProvider`'s own
#    docstring states it follows "the same contract as SynthGmmProvider(cascade=True)",
#    and 145's own header separately confirms SynthGmmProvider's cascade+random_fg
#    combination was already verified safe (2026-09-13). Not yet run under cascade
#    before, though -- SMOKE TEST before committing to the full budget, per this
#    project's own established convention every 160-167 config followed.
#
#    Same reasoning kept 167's augmentations.task.deform (p=0.2, calibrated setting) ON,
#    rather than reverting to 145-147's deform=0 -- it's part of 167's validated recipe,
#    not part of the cascade mechanism itself, so there's no reason cascade should drop it.
#
# 2. CASCADE_REGISTERS: turned OFF (was `true` in 167, inherited unchanged from 135b's
#    architecture since 147 first added it). PERFORMANCE_ANALYSIS.md §3 / 2a_cascade
#    found registers regresses in-distribution Dice (0.5246->0.5050) with no OOD upside
#    -- 146 (registers=off) is the best-performing arm of that whole chain, not 147. This
#    run follows 146, not 147. `checkpoint_allow_partial: true` REQUIRED for the same
#    reason 145/146 needed it: 167's checkpoint carries `cascade_proj`/`cascade_type`
#    params this (registers=false) architecture doesn't have -- those two keys are simply
#    dropped on load, everything else loads byte-identical.
#
# CASCADE MECHANICS (unchanged from 146, its own validated recipe -- see 145's header for
# the full rationale on each):
#   - cascade_query_prior: pred (real previous-level prediction, not perturbed-GT --
#     146's own comparison found this the better prior source)
#   - cascade_center_mode: train=random_fg (samples inside the mask -- built for
#     donut/non-convex/multi-focal targets like ISLES22/shifts_ms), eval=com (stable,
#     comparable val/test Dice)
#   - cascade_spacings=[4, 1.5] fixed eval/periodic-val ladder -- the finest level
#     (1.5mm) already matches 167's own train_spacing_range motivation (widening toward
#     ISLES22/Shifts-MS's real eval pitch), so no change needed here.
#   - cascade_train={levels:2, spacing_range:[1,6]} randomized train ladder; superset of
#     167's own [1.5,6] single-level range.
#   - data.train_spacing_range -> null (mutually exclusive with cascade_spacings);
#     crop_spacing_mm -> 4 (= cascade_spacings[0], was 3.0 under 167's non-cascade setup).
#   - data.query_prior / data.prior_perturb dropped entirely (146's own choice: the real
#     prediction is already imperfect, adding synthetic noise on top would confound the
#     "perturbed-GT vs real-pred" comparison that chain isolated; inert under cascade
#     query_prior=pred regardless).
#
# COMPUTE: batch_size 8->4 and lr 1e-4->7.1e-5, both matching 146's cascade-appropriate
# values (cascade roughly doubles memory/compute per level vs. 167's single-level pass).
#
# BUDGET: epochs=20, a SHORT PROBE (not 146's 60, not 167's 400) -- this combines two
# previously-untested-together mechanisms (real-host synth + cascade) for the first
# time, so validate small before committing further, per the project's own
# established "probe before full budget" convention throughout the 160-167 sweep.

defaults:
  - /encoder: e4_plainconv_ts
  - override /dataset: multisource_ct_mri
  - override /model: m2_patchset_decoder
  - override /augmentations: calibrated
  - _self_

arch:
  plainconv_ts_features_per_stage: [32, 64, 256, 512]
  nnunet_ts_stages: [2, 3]
  encoder_input_norm: instance
  encoder_spacing_aware: true
  compile_dynamic: false
  mask_slots: 1
  decode_source: img
  mask_embed: linear
  cascade_registers: false   # OFF (was true in 167) -- see DECISION 2 above
  pool_token: true

data:
  train_spacing_range: null      # was [1.5, 6] under 167 -- mutually exclusive with cascade_spacings
  crop_spacing_mm: 4             # was 3.0 under 167 -- must == cascade_spacings[0]
  cascade_spacings: [4, 1.5]     # fixed ladder for eval / periodic val-during-train (146)
  cascade_train:                 # randomized 2-level TRAIN ladder (146)
    levels: 2
    spacing_range: [1, 6]
  cascade_query_prior: pred      # real previous-level prediction (146)
  cascade_center_mode:            # train samples inside the mask; eval stays COM (145/146)
    mode: random_fg
    eval_mode: com
  gpu_realize_crop: true
  ram_cache: true
  p_synth: 0.5                   # KEPT from 167 -- see DECISION 1 above (was 0 in 145-147)
  gpu_realize_max_native: 128
  gmm:                            # unchanged from 167 -- full real-host recipe kept active
    paint_mask_aligned: true
    var_max: 80
    background_mode: zero
    mu_group_ids: merged
    mu_group_rho: null
    sd_between_ratio: ct_mri
    sd_group_ids: merged
    sd_group_rho: null
    p_shape: 1.0
    real_host_families: [blob, splatter, disk, cylinder, scatter_field, vessel, torus]
    real_host_cls: all
    real_host_include_ct: true
    real_host_ct_weight: 1.0
    shape:
      host_anchored: true
      family_weights: {blob: 1.0, splatter: 1.0, disk: 1.0, cylinder: 1.0,
                       scatter_field: 4.0}
    texture:
      n_octaves: 4
    p_heterogeneity: 0.3
    heterogeneity:
      core_fraction: 0.35
      core_offset_ratio: 0.8
      sigma1_range: [1.0, 4.0]
      sigma2_range: [0.5, 2.0]
  cohort:                         # unchanged from 167
    w_by_class_size: 1
    randomness: 1
    by_class_size_common_frac: 0.75
    by_class_size_mode: fraction
    exclude_src: [TotalSegmentatorV2]
  source_mix:
    per_source_train_classes: [balanced, balanced]
    regime_p: [0.5, 0.5, 0.0]
    eval_epoch_length: 800
  # data.query_prior / data.prior_perturb intentionally absent -- see CASCADE MECHANICS
  # note above (146's own choice; inert under cascade_query_prior=pred regardless).

augmentations:
  task:
    affine: {p: 0.5, scale_min: 1, scale_max: 1}
    elastic: {p: 0}
    deform: {p: 0.2, control_points: 6, max_disp: 0.15, num_steps: 6}   # KEPT from 167
    mask_interp: bilinear
  per_image:
    affine: {p: 0.2}
    elastic: {p: 0}
    deform: {p: 0}
    mask_interp: bilinear
  goal_mask:
    p: 0.4
    ops: [dilate, erode, boundary, sobel]

train:
  epochs: 20
  batch_size: 4
  eval_every: 5
  workers: 12
  grad_clip: 1.0
  profile_timing: true
  drop_last: true

  lr: 7.1e-5
  encoder_lr_scale: 1
  warmup_epochs: 1
  cascade_loss_weights: [1, 1]
  checkpoint: /nfs/data/nii/data1/Analysis/camaret___in_context_segmentation/ANALYSIS_20251122/results/patch_icl/3d_train/2026-09-28_167_real_host_all_shapes_wide_spacing/best.pt
  checkpoint_allow_partial: true   # cascade_registers=false drops cascade_proj/cascade_type
  resume_weights_only: true

eval:
  split: val
  n_subjects: null
  tasks_per_class: 10
  crop_jitter: 0

wandb:
  name: 168_cascade_real_host_all_shapes
