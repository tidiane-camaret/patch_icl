# @package _global_
# 94_multisource_synth_heterogeneity — 93_multisource_synth_texture + core/rim
# multi-region target paint (HeterogeneitySpec.p_heterogeneity>0), layered on top of
# the multi-octave texture noise. Targets the lesion-heavy far-OOD failure mode
# directly (isles22/gnc_kidney/hu_lwk1 per docs/datasets/eval_expansion_status.md).
# See docs/logs.md 2026-09-16 and src/providers/synth_gmm.py::HeterogeneitySpec/
# _heterogeneity_map.
#
# Starting point, not yet tuned against eval. Builds on 93 (not 92) so a clean 3-way
# ablation is possible: 92 (baseline) vs 93 (+texture) vs 94 (+texture+heterogeneity).
#
#   python experiments/3d/train.py experiment=94_multisource_synth_heterogeneity

defaults:
  - 93_multisource_synth_texture
  - _self_

data:
  gmm:
    p_heterogeneity: 0.3
    heterogeneity:
      core_fraction: 0.35
      core_offset_ratio: 0.8
      sigma1_range: [1.0, 4.0]
      sigma2_range: [0.5, 2.0]
