# @package _global_
# 161_scatter_field_isolated -- follow-up to 160 (docs/logs.md 2026-09-27): 160's 7-family mix
# (blob/splatter/disk/cylinder/scatter_field/vessel/torus, scatter_field at 1.5/7≈21% of
# shape-mode draws) gave a CLEAN NULL RESULT on all 4 target OOD sources vs. 135b (isles22
# 0.050->0.0469, shifts_ms 0.008->0.0090, atlas_v2 0.028->0.0277, gnc_kidney 0.082->0.0758 --
# every delta within noise). Read as a DOSAGE problem, not a "scatter_field doesn't help"
# result: p_synth=0.5 * (1.5/7) ≈ 10.7% of ALL training tasks ever saw scatter_field specifically
# over just 31 epochs -- likely too dilute to move anything.
#
# This probe isolates the single best-justified hypothesis (scatter_field directly targets the
# largest measured real-vs-synthetic gap, docs/logs.md 2026-09-26's multiplicity finding) at a
# MUCH higher dose to get a clean signal before deciding whether/how to blend: family_weights
# gives scatter_field HALF of all shape-mode draws (4 vs. the original 4 families' combined 4),
# and drops vessel/torus from this probe entirely -- they're the least-tested, least-justified
# additions, and including them here would confound "did the dose increase help" with "did
# adding untested families help/hurt". One variable at a time, matching this project's own
# established methodology (105/106/107, 131/132/133's isolate-before-blend chain).
#
#   python experiments/3d/train.py experiment=161_scatter_field_isolated
#
# Everything else identical to 160/135 (same checkpoint, same p_synth/p_shape, same 31-epoch
# quick-probe budget, same architecture -- pure data-generation change only).

defaults:
  - /encoder: e4_plainconv_ts
  - override /dataset: multisource_ct_mri
  - override /model: m2_patchset_decoder
  - override /augmentations: calibrated
  - _self_

arch:
  plainconv_ts_features_per_stage: [32, 64, 256, 512]
  nnunet_ts_stages: [2, 3]
  encoder_input_norm: instance
  encoder_spacing_aware: true
  compile_dynamic: false
  mask_slots: 1
  decode_source: img
  mask_embed: linear
  cascade_registers: true
  pool_token: true

data:
  train_spacing_range: [3, 6]
  crop_spacing_mm: 4.24
  gpu_realize_crop: true
  ram_cache: true
  p_synth: 0.5
  gpu_realize_max_native: 128
  gmm:
    paint_mask_aligned: true
    var_max: 80
    background_mode: zero
    mu_group_ids: merged
    mu_group_rho: null
    sd_between_ratio: ct_mri
    sd_group_ids: merged
    sd_group_rho: null
    p_shape: 1.0
    shape:
      host_anchored: true
      family_weights: {blob: 1.0, splatter: 1.0, disk: 1.0, cylinder: 1.0,
                       scatter_field: 4.0}
    texture:
      n_octaves: 4
    p_heterogeneity: 0.3
    heterogeneity:
      core_fraction: 0.35
      core_offset_ratio: 0.8
      sigma1_range: [1.0, 4.0]
      sigma2_range: [0.5, 2.0]
  cohort:
    w_by_class_size: 1
    randomness: 1
    by_class_size_common_frac: 0.75
    by_class_size_mode: fraction
    exclude_src: [TotalSegmentatorV2]
  source_mix:
    per_source_train_classes: [balanced, balanced]
    regime_p: [0.5, 0.5, 0.0]
    eval_epoch_length: 800

  query_prior:
    modes: [gt, none]
    p: [0.3, 0.7]
  prior_perturb:
    p: 1.0
    ball: false
    dilate_mm: [2.0, 8.0]
    erode_mm:  [2.0, 8.0]
    erode_min_keep: 0.15
    shift_mm:  [4.0, 12.0]
    noise_std: [0.15, 0.4]

augmentations:
  task:
    affine: {p: 0.5, scale_min: 1, scale_max: 1}
    elastic: {p: 0}
    deform: {p: 0}
    mask_interp: bilinear
  per_image:
    affine: {p: 0.2}
    elastic: {p: 0}
    deform: {p: 0}
    mask_interp: bilinear
  goal_mask:
    p: 0.4
    ops: [dilate, erode, boundary, sobel]

train:
  epochs: 31
  batch_size: 8
  eval_every: 10
  workers: 12
  grad_clip: 1.0
  profile_timing: true
  drop_last: true

  lr: 1.0e-4
  encoder_lr_scale: 1
  warmup_epochs: 1
  checkpoint: /nfs/data/nii/data1/Analysis/camaret___in_context_segmentation/ANALYSIS_20251122/results/patch_icl/3d_train/2026-09-23_135b_varspacing_synth05_shape1_intensitycalib_continue/best.pt
  checkpoint_allow_partial: false   # identical arch to 135b -- strict full-shape load
  resume_weights_only: true

eval:
  split: val
  n_subjects: null
  tasks_per_class: 10
  crop_jitter: 0

wandb:
  name: 161_scatter_field_isolated
