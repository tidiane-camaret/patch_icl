# @package _global_
# 142_..._cascade_gtprior_regoff — coarse-to-fine ablation, cell (registers=OFF,
# prior=perturbed-GT). Sibling of 140/141/143 -- see 140's WHY/CASCADE LADDER/QUERY
# PRIOR notes, which apply here unchanged. The ONLY difference from 140 is
# `arch.cascade_registers`:
#
#   140         registers=on,  prior=perturbed-GT
#   141         registers=on,  prior=real prev.pred
#   142 (this)  registers=off, prior=perturbed-GT
#   143         registers=off, prior=real prev.pred
#
#   python experiments/3d/train.py experiment=142_cascade_gtprior_regoff
#
# CHECKPOINT: resumes 135b's own best.pt. `checkpoint_allow_partial: true` is REQUIRED
# here (unlike 140/141): 135b's checkpoint carries `cascade_proj`/`cascade_type` params
# this smaller (registers=false) model doesn't have; those two keys are simply dropped,
# everything else loads byte-identical.

defaults:
  - /encoder: e4_plainconv_ts
  - override /dataset: multisource_ct_mri
  - override /model: m2_patchset_decoder
  - override /augmentations: calibrated
  - _self_

arch:
  plainconv_ts_features_per_stage: [32, 64, 256, 512]
  nnunet_ts_stages: [2, 3]
  encoder_input_norm: instance
  encoder_spacing_aware: true
  compile_dynamic: false
  mask_slots: 1
  decode_source: img
  mask_embed: linear
  cascade_registers: false   # was true -- the isolated change vs 140
  pool_token: true

data:
  train_spacing_range: null      # was [3, 6] -- mutually exclusive with cascade_spacings
  crop_spacing_mm: 4             # was 4.24 -- must == cascade_spacings[0]
  cascade_spacings: [4, 1.5]     # fixed ladder for eval / periodic val-during-train
  cascade_train:                 # randomized 2-level TRAIN ladder -- see 140's CASCADE LADDER
    levels: 2
    spacing_range: [1, 6]
  cascade_query_prior:            # train always draws gt_coarse (perturbed below); eval
    modes: [gt, pred]            # deterministically uses the real cascade (pred).
    p: [1.0, 0.0]
    eval_mode: pred
  gpu_realize_crop: true
  ram_cache: true
  p_synth: 0.5
  gpu_realize_max_native: 128
  gmm:
    paint_mask_aligned: true
    var_max: 80
    background_mode: zero
    mu_group_ids: merged
    mu_group_rho: null
    sd_between_ratio: ct_mri
    sd_group_ids: merged
    sd_group_rho: null
    p_shape: 1.0
    shape:
      host_anchored: true
    texture:
      n_octaves: 4
    p_heterogeneity: 0.3
    heterogeneity:
      core_fraction: 0.35
      core_offset_ratio: 0.8
      sigma1_range: [1.0, 4.0]
      sigma2_range: [0.5, 2.0]
  cohort:
    w_by_class_size: 1
    randomness: 1
    by_class_size_common_frac: 0.75
    by_class_size_mode: fraction
    exclude_src: [TotalSegmentatorV2]
  source_mix:
    per_source_train_classes: [balanced, balanced]
    regime_p: [0.5, 0.5, 0.0]
    eval_epoch_length: 800
  prior_perturb:
    p: 1.0
    ball: false
    dilate_mm: [2.0, 8.0]
    erode_mm:  [2.0, 8.0]
    erode_min_keep: 0.15
    shift_mm:  [4.0, 12.0]
    noise_std: [0.15, 0.4]
  # data.query_prior (non-cascade path) intentionally absent -- inert under cascade_spacings.

augmentations:
  task:
    affine: {p: 0.5, scale_min: 1, scale_max: 1}
    elastic: {p: 0}
    deform: {p: 0}
    mask_interp: bilinear
  per_image:
    affine: {p: 0.2}
    elastic: {p: 0}
    deform: {p: 0}
    mask_interp: bilinear
  goal_mask:
    p: 0.4
    ops: [dilate, erode, boundary, sobel]

train:
  epochs: 60
  batch_size: 4                  # was 8 -- lr scaled sqrt(4/8) accordingly, see below
  eval_every: 20
  workers: 12
  grad_clip: 1.0
  profile_timing: true
  drop_last: true

  lr: 7.1e-5                     # was 1.0e-4 -- sqrt(4/8)=0.71 scaling for batch_size 8->4
  encoder_lr_scale: 1
  warmup_epochs: 1
  cascade_loss_weights: [1, 1]
  checkpoint: /nfs/data/nii/data1/Analysis/camaret___in_context_segmentation/ANALYSIS_20251122/results/patch_icl/3d_train/2026-09-23_135b_varspacing_synth05_shape1_intensitycalib_continue/best.pt
  checkpoint_allow_partial: true   # cascade_registers=false drops cascade_proj/cascade_type
  resume_weights_only: true

eval:
  split: val
  n_subjects: null
  tasks_per_class: 10
  crop_jitter: 0

wandb:
  name: 142_cascade_gtprior_regoff
