# @package _global_
# 59_organs_cascade_from_scratch — exp57 + N-level coarse->fine cascade training.
#
#   python experiments/3d/train.py experiment=59_organs_cascade_from_scratch
#
# Two levels: predict at 3 mm (GT-centred), re-crop the target on the predicted
# centre-of-mass, predict at 1.5 mm; independent weighted loss per level, single backward.
# Geometric augmentation params are sampled once per task and replayed at both levels.
# Val runs the same cascade; `val/dice` is the stitched native Dice (all levels composited
# coarse->fine, each overwriting the previous). See
# docs/superpowers/specs/2026-08-30-cascade-training-patchset3d-design.md.
#
# IMAGE CACHES (measured): without per-spacing `ct_raw_{s:g}mm.npy` caches (ct_raw_3mm.npy,
# ct_raw_1.5mm.npy) the provider falls back to the full-res ct_raw.npy on every re-crop load.
# On this cluster only ct_raw_6mm.npy exists, so each step does ~B*(K+1) synchronous full-res
# loads (~195 ms at 3 mm, ~18-26 ms at 1.5 mm) ≈ +0.3 s/step and ~100 s per val pass. Build
# the caches (scripts/ downsample) to remove it — training is correct without them, just slow.

defaults:
  - 57_organs_encoder_from_scratch
  - _self_

data:
  crop_spacing_mm: 3            # == cascade_spacings[0]
  cascade_spacings: [3, 1.5]    # coarse -> fine
  cascade_crop_jitter: 0        # re-cropped levels respect the predicted COM exactly
  cascade_recrop_workers: 16    # thread-pool the B*(K+1) re-crop loads per level>0 (0/1 = serial)
  # Feed level i-1's mask (not just its COM) to level i as the query's mask-token prior,
  # resampled onto level i's augmented grid (M2 affine warp; see cascade.py::_warp_prior_m2
  # and results/3d/query_prior_injection/). Modes (default none):
  #   pred       sigmoid(logit_{i-1}) detached — the real cascade
  #   gt_coarse  level i-1's GT warped — perfect-coarse-seg ceiling (eval is an oracle number)
  #   gt_fine    level i's own GT — perfect-prior ceiling (eval is an oracle number)
  # Eval uses the SAME mode as train, so gt_* runs report ceilings, not deployable Dice.
  cascade_query_prior: pred
  cascade_query_prior_hard: false     # threshold the prior at 0.5 before the mask embed

train:
  cascade_loss_weights: [1.0, 1.0]

eval:
  # The cascade runs 2 forwards + a native-volume stitched-Dice per task, so val cost is
  # ~2-3x the non-cascade pass. 3 (of 63 val classes) keeps eval under a few minutes; raise
  # for a fuller generalization read once a run looks promising (exp57 used 20 = ~1260 tasks,
  # which is ~30 min under the cascade).
  tasks_per_class: 3

wandb:
  name: 59_organs_cascade_from_scratch
