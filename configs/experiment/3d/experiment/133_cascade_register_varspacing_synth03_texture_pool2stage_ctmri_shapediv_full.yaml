# @package _global_
# 133_..._shapediv_full — consolidates the two validated shape-diversity wins (131's splatter
# widening + 132's non-splatter widening) into ONE recipe at the chain's normal 51-epoch budget
# (131/132 were both 31-epoch probes). Continues 130's checkpoint (CT+MRI mainline).
#
#   python experiments/3d/train.py experiment=133_cascade_register_varspacing_synth03_texture_pool2stage_ctmri_shapediv_full
#
# WHY (2026-09-23): 131 (splatter-only widening) and 132 (non-splatter-only widening, splatter
# untouched) were run as a paired counterfactual to isolate mechanism -- see docs/logs.md same
# date. Verdict: general shape-cohort diversity is the dominant effect (132 reproduces 77-94%
# of 131's gain on shifts_ms/hu_lwk1 with zero splatter change), with a smaller genuine
# scatter-specific residual on top (visible mainly on isles22: 131's 0.0770 > 132's 0.0647).
# Since both widenings are independent, non-overlapping ShapeCohortSpec fields
# (splatter_n_components_range/spread_mm_range/family_weights.splatter vs.
# blob_roughness_range/disk_aspect_ratio_range/cylinder_length_mm_range), this run combines
# BOTH to capture the full measured gain, at the full 51-epoch budget both probes were
# deliberately shortened from (31 epochs) to get a fast readout.
#
# msd_prostate was the one source where BOTH probes hurt (130 0.0806 > 132 0.0553 > 131 0.0697,
# monotonically worse with more diversity) -- unresolved, watch this source specifically in the
# eval sweep once this finishes; not addressed by this run.
#
# CHECKPOINT: resumes 130's own best.pt (same base as 131/132). Architecture identical -- strict
# full-shape load. warmup_epochs=1 (chain standard, no new/reinitialized parameters).

defaults:
  - /encoder: e4_plainconv_ts
  - override /dataset: multisource_ct_mri
  - override /model: m2_patchset_decoder
  - override /augmentations: calibrated
  - _self_

arch:
  plainconv_ts_features_per_stage: [32, 64, 256, 512]
  nnunet_ts_stages: [2, 3]
  encoder_input_norm: instance
  encoder_spacing_aware: true
  compile_dynamic: false
  mask_slots: 1
  decode_source: img
  mask_embed: linear
  cascade_registers: true
  pool_token: true

data:
  train_spacing_range: [3, 6]
  crop_spacing_mm: 4.24
  gpu_realize_crop: true
  ram_cache: true
  p_synth: 0.3
  gpu_realize_max_native: 128
  gmm:
    paint_mask_aligned: true
    var_max: 80
    background_mode: zero
    mu_group_ids: null
    mu_group_rho: null
    sd_between_ratio: null
    p_shape: 0.5
    shape:
      family_weights: {blob: 1.0, splatter: 3.0, disk: 1.0, cylinder: 1.0}   # from 131
      splatter_n_components_range: [2, 60]                                   # from 131
      splatter_spread_mm_range: [5.0, 60.0]                                  # from 131
      blob_roughness_range: [0.05, 0.6]                                      # from 132
      disk_aspect_ratio_range: [0.05, 0.6]                                   # from 132
      cylinder_length_mm_range: [15.0, 150.0]                                # from 132
    texture:
      n_octaves: 4
    p_heterogeneity: 0.3
    heterogeneity:
      core_fraction: 0.35
      core_offset_ratio: 0.8
      sigma1_range: [1.0, 4.0]
      sigma2_range: [0.5, 2.0]
  cohort:
    w_by_class_size: 1
    randomness: 1
    by_class_size_common_frac: 0.75
    by_class_size_mode: fraction
    exclude_src: [TotalSegmentatorV2]
  source_mix:
    per_source_train_classes: [balanced, balanced]
    regime_p: [0.5, 0.5, 0.0]
    eval_epoch_length: 800

  query_prior:
    modes: [gt, none]
    p: [0.3, 0.7]
  prior_perturb:
    p: 1.0
    ball: false
    dilate_mm: [2.0, 8.0]
    erode_mm:  [2.0, 8.0]
    erode_min_keep: 0.15
    shift_mm:  [4.0, 12.0]
    noise_std: [0.15, 0.4]

augmentations:
  task:
    affine: {p: 0.5, scale_min: 1, scale_max: 1}
    elastic: {p: 0}
    deform: {p: 0}
    mask_interp: bilinear
  per_image:
    affine: {p: 0.2}
    elastic: {p: 0}
    deform: {p: 0}
    mask_interp: bilinear
  goal_mask:
    p: 0.4
    ops: [dilate, erode, boundary, sobel]

train:
  epochs: 51
  batch_size: 8
  eval_every: 10
  workers: 12
  grad_clip: 1.0
  profile_timing: true
  drop_last: true

  lr: 1.0e-4
  encoder_lr_scale: 1
  warmup_epochs: 1
  checkpoint: /nfs/data/nii/data1/Analysis/camaret___in_context_segmentation/ANALYSIS_20251122/results/patch_icl/3d_train/2026-09-22_130_cascade_register_varspacing_synth03_texture_pool2stage_ctmri/best.pt
  checkpoint_allow_partial: false   # identical arch to 130 -- strict full-shape load
  resume_weights_only: true

eval:
  split: val
  n_subjects: null
  tasks_per_class: 10
  crop_jitter: 0

wandb:
  name: 133_cascade_register_varspacing_synth03_texture_pool2stage_ctmri_shapediv_full
