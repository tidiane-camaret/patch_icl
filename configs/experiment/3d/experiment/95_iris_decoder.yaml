#
#   python experiments/3d/train.py experiment=95_iris_decoder \
#     train.checkpoint=<a 92-line best.pt> train.resume_weights_only=true

defaults:
  - 92_multisource_synth
  - _self_

arch:
  decoder: iris

wandb:
  name: 95_iris_decoder
