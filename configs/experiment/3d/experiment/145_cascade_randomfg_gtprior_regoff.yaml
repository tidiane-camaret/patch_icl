# @package _global_
# 145_cascade_randomfg_gtprior_regoff — coarse-to-fine ablation, STEP 1 of a 3-step
# CUMULATIVE build-up (not a factorial A/B, user-specified order, supersedes the
# 140-144 chain's ordering): each step adds ONE more mechanism swap on top of the
# previous step's config, all three resuming 135b independently (same shared ancestor,
# not chained checkpoints).
#
#   145 (this)  registers=off, prior=perturbed-GT, center=random_fg   (anchor)
#   146         145 + prior=real prev.pred
#   147         146 + registers=on
#
#   python experiments/3d/train.py experiment=145_cascade_randomfg_gtprior_regoff
#
# WHY THIS ORDER (2026-09-23, user-specified): starts from `cascade_registers=false`
# (the mechanism NOT active) and `cascade_center_mode=random_fg` ALREADY on from step 1
# (not added last) -- random_fg samples the re-crop centre from a random voxel *inside*
# the (binarized) prediction instead of its probability-weighted centroid, built because
# COM can land off-mask on donut/non-convex/multi-focal targets (ISLES22/shifts_ms's
# failure shape). Implemented 2026-09-12 (`cascade.py::_random_fg_point`) and never once
# measured against `com` with an actual Dice number anywhere in this repo (checked
# `docs/logs.md` + every dataset doc) -- this is its first real eval.
#
# QUERY PRIOR (this step): `cascade_query_prior={modes:[gt,pred], p:[1.0,0.0],
# eval_mode:pred}` -- every TRAIN step draws `gt_coarse` (level i-1's own augmented GT,
# M2-warped; `eval_mode` must be a listed mode per `_resolve_prior_spec`, hence `pred` at
# weight 0 rather than omitted) then degrades it via `prior_perturb` (dilate/erode/shift/
# noise -- same values used throughout this lineage and 88_cascade's own convention).
# EVAL deterministically uses `pred` (the real cascade).
#
# CENTER MODE: `data.cascade_center_mode={mode: random_fg, eval_mode: com}` -- EVAL stays
# deterministic `com` (the mapping form's documented default) so val/test Dice remains
# stable and comparable across epochs/checkpoints, same train/eval-split convention
# already used for `cascade_query_prior`. `SynthGmmProvider` (this cohort's `p_synth=0.5`
# branch) has real `random_fg` support (wired + tested 2026-09-13, not the
# `NotImplementedError` stub from its first cut) -- confirmed safe to combine with this
# recipe's synth fraction.
#
# REGISTERS: `arch.cascade_registers=false` -- NOT active this step (added last, in 147).
# `checkpoint_allow_partial: true` is REQUIRED: 135b's checkpoint carries
# `cascade_proj`/`cascade_type` params this smaller (registers=false) model doesn't have;
# those two keys are simply dropped, everything else loads byte-identical.
#
# DATA RECIPE (this train sweep only, user-specified): `data.p_synth=0` (was 0.5 in the
# 140-144 chain) -- REAL anatomy (TotalSeg CT+MRI via `multisource_ct_mri`) only, no
# synth_gmm cohort at all. Removes the synth-generation confound (procedural shapes,
# intensity calibration, texture noise, GMM-bank re-crop cost) from this cascade-mechanism
# probe, and drops the entire `data.gmm`/`data.cohort` synth-bank config with it (both are
# fully inert once `p_synth=0` -- `experiments/3d/common.py` only builds `SynthGmmMaisiDataset`
# / reads `cohort_cfg` when `p_synth > 0`).
#
# CASCADE LADDER: TRAIN uses `data.cascade_train={levels:2, spacing_range:[1,6]}` -- a
# random 2-level ladder per step. `data.cascade_spacings=[4, 1.5]` is the separate FIXED
# ladder for eval / the periodic val pass during training (and the standalone post-hoc
# eval.py sweep). `data.crop_spacing_mm` must equal `cascade_spacings[0]` (4);
# `data.train_spacing_range` must be null (mutually exclusive with cascade_spacings).
# `train.cascade_loss_weights=[1,1]` (length matches both ladders, no ambiguity).

defaults:
  - /encoder: e4_plainconv_ts
  - override /dataset: multisource_ct_mri
  - override /model: m2_patchset_decoder
  - override /augmentations: calibrated
  - _self_

arch:
  plainconv_ts_features_per_stage: [32, 64, 256, 512]
  nnunet_ts_stages: [2, 3]
  encoder_input_norm: instance
  encoder_spacing_aware: true
  compile_dynamic: false
  mask_slots: 1
  decode_source: img
  mask_embed: linear
  cascade_registers: false   # NOT active this step -- added last, in 147
  pool_token: true

data:
  train_spacing_range: null      # was [3, 6] -- mutually exclusive with cascade_spacings
  crop_spacing_mm: 4             # was 4.24 -- must == cascade_spacings[0]
  cascade_spacings: [4, 1.5]     # fixed ladder for eval / periodic val-during-train
  cascade_train:                 # randomized 2-level TRAIN ladder
    levels: 2
    spacing_range: [1, 6]
  cascade_query_prior:            # train always draws gt_coarse (perturbed below); eval
    modes: [gt, pred]            # deterministically uses the real cascade (pred).
    p: [1.0, 0.0]
    eval_mode: pred
  cascade_center_mode:            # NEW (from step 1): train samples inside the mask;
    mode: random_fg              # eval stays COM for stable, comparable Dice.
    eval_mode: com
  gpu_realize_crop: true
  ram_cache: true
  p_synth: 0                     # was 0.5 -- train sweep uses REAL anatomy only (see WHY
                                   # above); drops the entire gmm/cohort synth-bank config
                                   # below with it (both are inert once p_synth=0).
  gpu_realize_max_native: 128
  source_mix:
    per_source_train_classes: [balanced, balanced]
    regime_p: [0.5, 0.5, 0.0]
    eval_epoch_length: 800
  prior_perturb:
    p: 1.0
    ball: false
    dilate_mm: [2.0, 8.0]
    erode_mm:  [2.0, 8.0]
    erode_min_keep: 0.15
    shift_mm:  [4.0, 12.0]
    noise_std: [0.15, 0.4]
  # data.query_prior (non-cascade path) intentionally absent -- inert under cascade_spacings.

augmentations:
  task:
    affine: {p: 0.5, scale_min: 1, scale_max: 1}
    elastic: {p: 0}
    deform: {p: 0}
    mask_interp: bilinear
  per_image:
    affine: {p: 0.2}
    elastic: {p: 0}
    deform: {p: 0}
    mask_interp: bilinear
  goal_mask:
    p: 0.4
    ops: [dilate, erode, boundary, sobel]

train:
  epochs: 60
  batch_size: 4
  eval_every: 20
  workers: 12
  grad_clip: 1.0
  profile_timing: true
  drop_last: true

  lr: 7.1e-5
  encoder_lr_scale: 1
  warmup_epochs: 1
  cascade_loss_weights: [1, 1]
  checkpoint: /nfs/data/nii/data1/Analysis/camaret___in_context_segmentation/ANALYSIS_20251122/results/patch_icl/3d_train/2026-09-23_135b_varspacing_synth05_shape1_intensitycalib_continue/best.pt
  checkpoint_allow_partial: true   # cascade_registers=false drops cascade_proj/cascade_type
  resume_weights_only: true

eval:
  split: val
  n_subjects: null
  tasks_per_class: 10
  crop_jitter: 0

wandb:
  name: 145_cascade_randomfg_gtprior_regoff
