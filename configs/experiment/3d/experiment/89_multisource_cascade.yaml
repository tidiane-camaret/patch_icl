# @package _global_
# 89_multisource_cascade — 88_cascade's clean-arch coarse->fine cascade, trained JOINTLY
# on CT (totalseg) + MRI (totalsegmri) through the v2 cohort provider.
#
#   python experiments/3d/train.py experiment=89_multisource_cascade \
#     train.checkpoint=<a same-arch CT cascade best.pt>   # e.g. 88_cascade's output, or
#                                                         # 2026-09-01_67_cascade_qprior_pred_crop_gpu/best.pt
#
# = 88_cascade  +  dataset=multisource_ct_mri  +  the handful of overrides the cohort
# dataset needs to satisfy the cascade guards. Everything else (the removed
# decode_source=mask / mask_slots=2 / mask_embed=conv bundle, the [6,3,1.5] ladder,
# cascade_train, prior_perturb, goal_mask, the gentle resume-finetune schedule) is
# inherited from 88_cascade unchanged.
#
# HOW THE COHORT + CASCADE PATH WORKS (src/providers/multisource.py, spec
# docs/superpowers/specs/2026-09-07-multisource-cascade-design.md):
#   * MultiSourceProvider wraps two modality-locked TotalSegProviders (CT + MRI). Per
#     task it draws a modality REGIME -- ~1/3 all-CT, ~1/3 all-MRI, ~1/3 forced cross
#     (target one modality, all K contexts the other) -- THEN the class from that
#     regime's pool, so the cross third is a genuine cross-modality rate.
#   * Level 0: assemble_task emits an imageless `native_crop` payload per member with a
#     per-member `NativeCrop.norm` (CT fingerprint for CT members, per-subject z-score
#     spec for MRI members), so a single batch can mix CT + MRI members and each
#     self-normalizes on the GPU (realize_native_crops).
#   * Levels >=1: `tgt_modality` / `ctx_modality` are threaded through the collates and
#     `cascade._recrop_level` routes each re-crop load to the right sub-provider.
#   * gpu_realize_crop + ram_cache both work (ram_cache = TWO caches, CT + MRI, ~2x the
#     ~35 GB single-source footprint -> needs a big-memory node).
#
# DATA: totalsegmri has ct_raw.npy + ct_raw_{6,3,1.5}mm.npy + ct_stats.json for every
# subject (prepped). meta.csv ships train/test only, so the dataset group remaps the MRI
# subject split val->test (source_mix.split_map).
#
# EVAL: cohort mode -> eval.tasks_per_class is INERT; the val pass draws
# source_mix.eval_epoch_length (2000) stochastic-but-seeded tasks across the ~117-class
# union. Regime/modality slice is NOT wired for the cascade val table (spec non-goal).

defaults:
  - 88_cascade
  - override /dataset: multisource_ct_mri
  - _self_

data:
  # multisource_ct_mri's group defaults break two cascade guards -- re-assert them.
  # (88_cascade's cascade_spacings / cascade_crop_jitter / cascade_recrop_workers /
  # ram_cache / gpu_realize_crop / cascade_query_prior / cascade_train / prior_perturb
  # / mask_downsample all carry through from 88_cascade unchanged.)
  train_spacing_range: null       # group default [1.5, 6.0] is forbidden with cascade_spacings
  crop_spacing_mm: 6              # group default 3; must == cascade_spacings[0]
  train_classes: union            # cohort sentinel (88 left these balanced/all -- inert for
  val_classes: union              # source=multisource, but reset to match the dataset group)
  source_mix:
    regime_p: [0.4, 0.4, 0.2]
    # TRAIN on the balanced anatomy set for BOTH modalities (group default was
    # [balanced, train] -- an oddly limb/lung-skewed 23-class MRI set that dropped
    # liver/kidney/colon/brain/... and left only a 14-class cross pool).
    #   CT  "balanced"            -> BALANCED_CLASSES (61)
    #   MRI "balanced" (is_mri)   -> BALANCED_CLASSES ∩ MRI_ALL_CLASSES (31; the 30 CT-only
    #                                members -- lung lobes, per-level vertebrae, single ribs,
    #                                head/neck vessels -- are correctly excluded)
    #   -> ct pool 61 / mri pool 31 / cross pool 31 (every MRI-balanced class is in
    #      CT-balanced by construction, so all three regimes draw from clean pools).
    # A shared NAME (liver, kidney_left, ...) is one class string; the modality is chosen
    # by the per-task regime, and the matching sub-provider serves that modality's subjects.
    per_source_train_classes: [balanced, balanced]
    # val stays [all, all] (group default) for a cross-modality generalization read
    # (train balanced subset of val); set [balanced, balanced] for an in-distribution val.
    # Eval cost: N seeded cohort tasks / eval, split ~1/3 per regime (ct/mri/cross). Group
    # default 2000 -> ~9 min/eval on loki; 800 -> ~3.7 min, ~267 samples/regime (a tight
    # mean; per-class ~7, already noisy at 17).
    eval_epoch_length: 800

arch:
  # Modality-agnostic input stem: per-sample z-score with no CT-fingerprint inversion.
  # Numerically ~identical to 88's `zscore` on CT (per src/models/encoders/_input_norm.py
  # the subsequent per-sample z-score is affine-invariant), but `instance` is the declared
  # modality-agnostic mode and carries no loader_spec dependency -- the right declaration
  # for a CT+MRI run. exp80/81 use it for the same reason.
  encoder_input_norm: instance

train:
  warmup_epochs: 1                # warm-start from a CT-only cascade checkpoint; no from-scratch peak

wandb:
  name: 89_multisource_cascade
