# @package _global_
# 92_multisource_synth — 89_multisource_cascade + synth_gmm as 3rd source (p=0.3)
# + full intensity aug set (GIN/IPA, bias field, gamma, low-res, invert)
#
#   python experiments/3d/train.py experiment=92_multisource_synth

defaults:
  - 89_multisource_cascade
  - _self_

data:
  p_synth: 0.3
  # Cascade re-crop (levels 1-2) is a synchronous, GPU-idle step; the native-crop stride-cap
  # (docs/logs.md) still costs ~600ms/call at the default 256. Measured on this bank: 128
  # cuts that to ~120ms (5x) with no quality loss vs. what the model sees anyway -- 128
  # equals the model's own grid size T, so a capped crop is already at grid resolution
  # before painting.
  gpu_realize_max_native: 128
  gmm:
    paint_mask_aligned: true
    var_max: 80
    background_mode: zero
    mu_group_ids: null
    mu_group_rho: null
    sd_between_ratio: null
    # Procedural blob/splatter/disk/cylinder shapes stamped into real hosts under a new
    # pseudo-class id (src/shapes3d/, docs/logs.md 2026-09-15) -- a distinct failure
    # mode from real-anatomy synth cohorts: the model has to find a sub-region shape
    # living inside a known organ, not just recognize the organ itself. Shape size and
    # position are physical (mm), anchored to the host's own centroid, so the SAME
    # shape is what every cascade level re-crops toward. Starting conservative (10% of
    # synth cohorts) -- not yet calibrated against eval; watch epoch throughput before
    # raising p_shape or the size/spread mm ranges (rasterization cost scales with the
    # requested physical size at fine crop_spacing_mm, see docs/logs.md).
    p_shape: 0
    shape: {}   # ShapeCohortSpec defaults (docs/logs.md 2026-09-15)
    # Multi-octave correlated paint noise ("fractal value noise"), replacing the flat
    # per-voxel i.i.d. GMM noise -- TextureSpec defaults (n_octaves=1) are an identity
    # passthrough, byte-identical to the old behavior; set n_octaves>1 to enable. See
    # the synth_gmm intra-mask realism investigation in docs/datasets/
    # eval_expansion_status.md (real tissue lag-1 autocorrelation ~0.6 vs the old
    # noise's ~0) and src/providers/synth_gmm.py::TextureSpec/_fractal_value_noise.
    texture: {}
    # Core/rim multi-region target paint (SyntheticTumors/DiffTumor-style threshold-
    # noise blob map), independent cohort-level coin flip from p_shape/p_synth -- off
    # by default. Targets the lesion-heavy far-OOD failure mode (isles22/gnc_kidney/
    # hu_lwk1) directly, per the 2026-09-16 literature survey in this thread. See
    # src/providers/synth_gmm.py::HeterogeneitySpec/_heterogeneity_map.
    p_heterogeneity: 0
    heterogeneity: {}   # HeterogeneitySpec defaults (docs/logs.md 2026-09-16)
  cohort:
    w_span: 0
    w_fov: 0
    w_spacing: 0
    w_by_class_size: 1
    randomness: 1
    min_masks_per_class: null
    by_class_size_common_frac: 0.75
    by_class_size_mode: fraction
    # this run also trains on the REAL TotalSegmentator CT source (multisource) -- exclude
    # its own masks from the synth bank so synth can't just recolor anatomy layouts the model
    # already sees as real data (297/4135 bank masks are src=TotalSegmentatorV2).
    exclude_src: [TotalSegmentatorV2]

augmentations:
  intensity:
    gin:
      p: 0.6
    bias_field:
      p: 0.4
      magnitude: 0.3
      coarse: 4
    gamma:
      range: [0.6, 1.7]
    gaussian_noise:
      p: 0.15
    simulate_low_resolution:
      p: 0.35
      scale_min: 0.25
      anisotropic: true
    invert:
      p: 0.15

wandb:
  name: 92_multisource_synth
