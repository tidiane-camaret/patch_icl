# @package _global_
# m1 — PatchSet3D set-transformer head + optimizer recipe. Selected as a Hydra group:
# `model=m1`. Encoder-forward keys are NOT here — pick a `encoder` group (e.g. encoder=e1)
# to fill arch.encoder*. Both groups merge into one `arch:` block.
model: patchset3d

arch:
  # --- transformer / head geometry ---
  l: 4                          # transformer layers
  e: 768                        # token width
  h: 3072                       # MLP hidden
  a: 12                         # attention heads
  transformer_rope: true        # RoPE positions in the set-transformer
  rope_theta: 100.0             # small-grid base frequency (<=32 tokens/axis)
  feat_norm: self               # encoder-feature norm: each side by its own stats (query decoupled)
  full_attn: true               # dense all-to-all attention (not register-routed)
  register_routed: false        # thinking rows NOT the sole cross-image bus
  register_flex: false          # dense bool-mask SDPA (avoids flex/ptxas cold-compile hang)
  thinking_rows: 64             # learned register rows prepended to the set
  query_self_attn: true         # target-token self-attention
  context_id_embed: true
  max_context: 16
  residual_decay: 0.95
  fourier_bands: 8
  mask_patch_size: 8            # mask tokenization tile (8^3 occupancy per cell)
  mask_patch_decode_size: 8     # decode tile: 16*8 = 128^3 prediction
  token_mask_ratio_support: 0.25  # SimMIM support-token masking (train only)
  token_mask_ratio_query: 0.50    # query-token masking (train only)
  # --- sub-patch decode (conv encoders only; see src/models/patchset3d.py::_decode) ---
  # false = per-token MLP emitting mask_patch_decode_size^3 constants per cell (no sub-patch
  # detail). true = each token emits a filter read against the query's own unpooled encoder
  # stage, so boundaries can be placed INSIDE a cell. Errors at construction on ViT encoders.
  fine_decode: false
  # Encoder stage(s) tapped (0 = full res, 1 = half, ...). An int taps one stage; a list
  # e.g. [0, 1] projects each at its native resolution and sums them at the finest grid
  # (== concat-then-project, since 1x1x1 conv and trilinear upsampling commute).
  fine_stage: 1
  # Width the fine maps are projected to = the token-generated filter's length. The readout
  # is LINEAR in the fine features, so filter rank is capped at min(fine_proj_dim, sum C_f);
  # above that the extra width is dead. C_f per stage on Dataset291: 32 / 64 / 128 / 256 ...
  fine_proj_dim: 64
  # Which fine_decode head (fine_decode=true only):
  #   fine_filter — per-cell token-generated filter dotted against the query's unpooled
  #                 features + linear tile term (default; cheap, cells don't interact).
  #   conv        — progressive coarse->fine conv decoder: project tokens to decoder_dim,
  #                 upsample the R^3 field, fuse each fine_stage (concat at coarse levels,
  #                 per-voxel FiLM at the finest), 3x3x3 conv per level, 1x1x1 head + a
  #                 token-only residual. Spatially coupled; ~6x the decode FLOPs.
  decoder: fine_filter
  decoder_dim: 64               # base width of the conv decoder (halves per level, >=8)
  compile: true                 # torch.compile the transformer + Muon Newton-Schulz
  # Extra compile targets (both need compile: true). Measured on exp52 + fine_decode, RTX PRO
  # 6000: encoder+decoder together = -6% step time / -1.0 GiB peak at B=8 K=1 fine_stage=1,
  # and -18% at B=4 K=3 fine_stage=[0,1] (encoder fwd -28%, decode fwd -80%). Compiled output
  # is not bit-exact vs eager (bf16 conv reassociation, ~0.7% mean logit drift) — keep a
  # setting fixed for the whole run rather than flipping it on a resume.
  compile_encoder: true         # image encoder stack (nnunet_ts/conv; ViT encoders always on)
  compile_decoder: true         # decode head (_decode: tile MLP or the fine_decode readout)

train:
  # --- optim recipe (model-intrinsic) ---
  # NOTE: keys that train.yaml's own block defines (epochs, batch_size, eval_every,
  # grad_clip, workers, seed) are applied by _self_ AFTER this group, so they must be
  # set in the experiment layer, not here. Only keys train.yaml does NOT define survive.
  optimizer: adamw              # only used when muon=false; muon path builds AdamW+Muon
  muon: true                    # Muon on transformer 2D matrices + AdamW on the rest + LAWA
  muon_lr_scale: 0.1            # Muon lr = muon_lr_scale * lr
  muon_momentum: 0.96
  muon_wd: 0.1
  lawa_k: 10                    # LAWA checkpoint-averaging buffer
  lr: 1.0e-4
  # Learning rate of a TRAINABLE image encoder (arch.encoder_frozen=false), as a fraction of
  # lr; 1.0 = one param group, i.e. the encoder learns at the head's rate. A pretrained
  # encoder needs a much smaller step than the randomly-initialized head (see exp53).
  encoder_lr_scale: 1.0
  # Zero weight decay on ndim<=1 params (InstanceNorm/LayerNorm gains, conv/linear biases).
  # Decaying a norm gain is not regularization — the conv after it is scale-invariant in the
  # forward, so shrinking ||W|| raises the EFFECTIVE step size instead of shrinking the signal.
  # false = one decayed group (reproduces exp43-53); turn on when the encoder trains.
  no_decay_norm_bias: false
  # Put Muon under the same warmup+cosine as AdamW (scaled to its own muon_lr_scale base).
  # false = Muon runs at a constant lr with no warmup and no anneal (exp48-53). Turn on when
  # the encoder is unfrozen — the head's inputs are then non-stationary for thousands of steps.
  muon_scheduled: false
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 1
  loss: bce_dice
  dice_weight: 1.0
  checkpoint: null              # null = fresh init | <path> = FULL resume (weights + optimizer
                                # moments + LR-schedule step count + epoch + best, so cosine
                                # CONTINUES rather than replaying warmup; docs/logs.md 2026-08-29)
  resume_weights_only: false    # true = warm-start WEIGHTS ONLY from train.checkpoint (fresh
                                # optimizer/schedule/epoch) — use when changing recipe or arch
