# @package _global_
# Medverse model + fine-tune recipe (optimizer/scheduler/loss/lr/batch), composed as
# `model=medverse`. Loss/optimizer/scheduler follow the Medverse/Neuroverse3D (Hu 2025)
# recipe. 128³ inputs only (Medverse runs level=1, no AR).
model: medverse
train:
  batch_size: 4
  optimizer: adam               # adam | adamw
  lr: 3.0e-5
  weight_decay: 0.0
  scheduler: plateau            # plateau | cosine | constant
  lr_factor: 0.5
  lr_patience: 5
  lr_min_factor: 0.01           # min_lr = lr * lr_min_factor
  warmup_epochs: 1              # cosine only (scheduler-coupled)
  loss: smooth_l1               # smooth_l1 | bce_dice
  loss_scale: 50.0
  dice_weight: 1.0              # bce_dice only
  checkpoint: orig_weights      # weight source: orig_weights (released Medverse.ckpt) |
                                # random (from scratch) | <path to our finetuned best.pt>
data:
  max_ds_len_train: 200         # fine-tune sample cap (overrides dataset/totalseg's 2000)

# Training perf knobs (see experiments/3d/bench_arch.py). At B=4 both together beat the
# eager baseline on time AND memory; applied after weight load in train.py.
medverse:
  grad_checkpoint: false        # gradient-checkpoint U-Net conv blocks: ~-50% activation
                                # memory, ~+25% step time (exact grads). Lets batch double.
  compile: false                # torch.compile the whole net: fuses norm/elementwise tail
                                # (~-10% time); slow first batch.
