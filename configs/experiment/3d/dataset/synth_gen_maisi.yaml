# @package _global_
# MAISI (NV-Generate-CTMR) synthetic whole-body CT/mask pairs as an in-context source.
# Generated by experiments/3d/synth_task_generation/gen_maisi_fast.py (one .npz per pair:
# ct f16 z-scored HU, label u8 MAISI-132 vocab, spacing). Composed as `dataset=synth_gen_maisi`.
# Native-only, MAISI vocabulary standalone (NO TotalSeg remap) — served by SynthGenMaisiDataset.
#   python scripts/train.py dataset=synth_gen_maisi
#   python experiments/3d/plot_dataset_items.py dataset=synth_gen_maisi --n_samples 4 \
#       data.context_size=2 augmentations.enabled=false
paths:
  synth_gen_maisi: /nfs/data/nii/data1/Analysis/camaret___in_context_segmentation/ANALYSIS_20251122/data/synth_task_gen/maisi
data:
  source: synth_gen_maisi
  image_size: [128, 128, 128]   # native npz are 384x384x512; _load resizes each to this
  context_size: 1
  class_balanced: true
  synth_method: null            # no supervoxel synth path for this source (real synth pairs)
  num_labels_per_sample: 1
  # MAISI vocabulary (e.g. "left kidney", "vertebrae L5"), NOT TotalSeg names.
  # "all" = every MAISI class present in the pairs; or an explicit list of MAISI names.
  train_classes: all
  val_classes: all
  max_train_subjects: null      # int to limit subjects for debugging
  max_val_subjects: null
  # use_crop: organ-centred native crop of physical extent image_size*crop_spacing_mm,
  # resampled to image_size^3 -> isotropic crop_spacing_mm/voxel (true 1.5mm crops).
  # false -> whole volume anisotropically resized to image_size (effective spacing
  # = native*shape/image_size, e.g. ~4.5x4.5x6.0mm for 384x384x512 -> 128^3).
  use_crop: false
  crop_spacing_mm: 1.5          # output mm/voxel when use_crop=true (FOV = image_size*this)
  crop_jitter: null             # train crop-centre jitter (voxels); null -> image_size//4
  mask_downsample: nearest      # nearest | occupancy (area-pool+threshold; keeps thin masks)
  mask_occupancy_thr: 0.5
