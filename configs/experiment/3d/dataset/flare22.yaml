# @package _global_
# FLARE22 (MICCAI 2022) — 50 densely-annotated abdominal CT, 13 organs, all present
# in all 50 cases => 650 (subject, class) eval tasks. Eval-only: no synth, no aug.
#
#   python scripts/convert_flare22.py --workers 16            # once, nii.gz -> native .npy
#   python experiments/3d/eval.py dataset=flare22 eval.model=patchset3d
#
# Stored at NATIVE anisotropic spacing (~0.8 x 0.8 x 2.5 mm); src/providers/flare22.py
# does the organ crop + isotropic resample at load time, so crop_spacing_mm is a knob
# here rather than a property of the conversion.
paths:
  flare22: /nfs/data/nii/data1/Analysis/camaret___in_context_segmentation/ANALYSIS_20251122/data/flare22/npy
data:
  source: flare22
  loader_v2: true               # flare22 is v2-only (Flare22Provider + InContextDataset)
  image_size: [128, 128, 128]
  context_size: 1
  use_crop: true
  # 1.5 mm: isotropic, matches the rest of the 3D harness (totalseg is 1.5 native).
  # NOTE this is NOT the GT-fidelity optimum for FLARE22 — 2.5 is, because there the crop
  # pitch equals the native z spacing so the z resample is an exact identity, and 320mm
  # truncates nothing. At 1.5 both axes resample AND the FOV clips GT (liver 3.9%, IVC 9.1%,
  # aorta 14.5% of GT voxels fall outside the crop). Round-trip Dice of a PERFECT predictor:
  #   pitch 1.5: liver .953 aorta .869 adrenal_R .793   pitch 2.5: .984 / .941 / .832
  # Override to 2.5 when comparability to published FLARE22 numbers matters.
  crop_spacing_mm: 1.5
  val_classes: all              # all 13, or an explicit subset (TotalSegmentator names)
  max_val_subjects: null
  mask_downsample: occupancy
  # 0.5, NOT the v2 provider default of 0.1: 0.1 dilates (adrenal GT volume ~1.7x vs
  # ~1.08x at 0.5) and round-trips worse on every organ.
  mask_occupancy_thr: 0.5
  image_antialias: true         # area-prefilter downsampled axes (2-4x in-plane decimation)
  class_balanced: false
