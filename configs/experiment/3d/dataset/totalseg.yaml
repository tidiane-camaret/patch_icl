# @package _global_
# totalseg 3D dataset block — composed by train.yaml / eval.yaml as `dataset=totalseg`
# (default). Also selectable as experiment=3d/dataset/totalseg through the global
# config entry (scripts/train.py). Only params that reach TotalSegInContextDataset.
defaults:
  - override /augmentations: multiverseg_v2   # matches multilevel's aug_preset
data:
  source: totalseg              # totalseg | totalsegmri  (3D build_dataset dispatch)
  image_size: [128, 128, 128]
  context_size: 1
  max_ds_len_train: 2000        # samples per train epoch (loader cap, not dataset content)
  max_train_subjects: null      # int to limit subjects for debugging, e.g. 50
  max_val_subjects: null        # int to limit subjects for debugging, e.g. 50
  synth_unions: false
  synth_method: seeds3d
  n_synth_merge_min: 1          # min adjacent SVs merged per synth label (inclusive)
  n_synth_merge_max: 5          # max adjacent SVs merged per synth label (inclusive)
  p_synth: 1
  class_balanced: true
  use_crop: true
  raw_ct: false                 # true: read native ct_raw.npy (raw HU) + normalise the crop on the fly (needs convert_to_npy.py --store-raw). Only affects native/use_crop reads; pre-resized fast path stays normalised. Lossless vs the float16 ct.npy, storage-neutral
  crop_spacing_mm: 1.5          # output mm/voxel of use_crop crops (FOV = image_size*this); 2.0 = CoLiPri native. Eval spacing ALWAYS, and the train spacing when train_spacing_range is null
  train_spacing_range: null     # [lo, hi] mm: TRAIN-ONLY per-batch log-uniform crop spacing (variable-spacing training via SpacingBatchSampler); null = fixed crop_spacing_mm. Eval ignores this
  mask_downsample: nearest      # nearest | occupancy (area-pool + threshold; keeps thin masks under heavy downsampling)
  mask_occupancy_thr: 0.5       # occupancy foreground-fraction threshold: ->0 keeps every touched voxel, 0.5 = majority
  self_context:                 # contexts = clones of the (augmented) target (trivial-matching / decoder ceiling probe, leakage by design)
    p:                          # PROBABILITY (0..1) a sample uses self-context; split-specific so you can train self-context but eval on real cross-subject contexts
      train: 0.0                # TRAIN prob (1.0 = always self-context; 0.0 = normal cross-subject)
      eval: 0.0                 # VAL/TEST prob (0.0 = different-case cross-subject eval; 1.0 = ceiling probe)
    augs:                       # when self-context fires, re-augment each clone INDEPENDENTLY (each toggle isolatable for clean A/B). No-op when aug is off (eval)
      per_image: false          # geometric pose jitter via augmentations.per_image (set augmentations.per_image.affine.p>0 to actually warp)
      intensity: false          # appearance jitter via augmentations.intensity (brightness/gamma/noise/blur), independent of the target's own intensity aug
    synth_masks:                # when self-context fires, replace the real target label with a PURELY SYNTHETIC mask (random rotated ellipsoid on the real CT body) -> geometric in-context task, no real anatomy
      p:                        # PROBABILITY (0..1), given self-context fired, of a synthetic ellipse instead of the real target label; split-specific (scalar = both splits). Pure-synth training: self_context.p.train=1.0 + this train=1.0
        train: 0.0              # TRAIN prob
        eval: 0.0               # VAL/TEST prob (self-context eval must also fire, i.e. self_context.p.eval>0)
      ellipse_min_mm: 1.0       # min per-axis ellipsoid radius (mm; converted to voxels via the item spacing)
      ellipse_max_mm: 50.0      # max per-axis ellipsoid radius (mm)
      body_hu: -400.0           # air/body HU threshold: the ellipsoid centroid is placed on a voxel above this (mapped to normalised CT units internally)
  random_coloring: false
  num_labels_per_sample: 1
  train_classes: not_benchmark
  val_classes: benchmark
