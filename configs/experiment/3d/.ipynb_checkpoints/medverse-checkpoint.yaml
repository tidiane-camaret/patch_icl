# @package _global_
# Fine-tune Medverse (experiments/3d/train.py), layered on config.yaml.
# Loss / optimizer / scheduler default to the Medverse / Neuroverse3D (Hu 2025) recipe.
#   python experiments/3d/train.py experiment=3d/medverse
#   python experiments/3d/train.py experiment=3d/medverse train.loss=bce_dice
# 128³ inputs only (Medverse runs level=1, no AR); AR teacher forcing deferred.

defaults:
  - 3d/dataset                  # shared 3D data block + aug preset (experiment/3d/dataset.yaml)
  - _self_

model: medverse

# Only the data knob that differs from 3d/dataset (which uses 2000):
data:
  max_ds_len_train: 200         # samples per epoch (RandomSampler cap) — smaller for fine-tuning

train:
  epochs: 100
  batch_size: 4
  workers: 8
  seed: 42
  eval_every: 1
  grad_clip: 1.0
  checkpoint: null              # resume/warm-start fine-tuned weights
  base_ckpt: null               # override the pretrained Medverse.ckpt
  random_init: true            # true -> train from scratch (ignore pretrained weights)
  out_dir: ${paths.results}/3d_train

  # optimizer (Medverse/Neuroverse3D: Adam, initial LR 3e-5)
  optimizer: adam               # adam | adamw
  lr: 3.0e-5
  weight_decay: 0.0

  # scheduler (Neuroverse3D: ReduceLROnPlateau on val Dice)
  scheduler: plateau            # plateau | cosine | constant
  lr_factor: 0.5
  lr_patience: 5
  lr_min_factor: 0.01           # min_lr = lr * lr_min_factor
  warmup_epochs: 1              # cosine only

  # loss (Neuroverse3D/Hu 2025: modified smooth-L1, scaled ×50)
  loss: smooth_l1               # smooth_l1 | bce_dice
  smooth_l1_beta: 1.0
  loss_scale: 50.0
  dice_weight: 1.0              # bce_dice only

eval:                           # used by the per-class validation make_loader
  split: val
  n_subjects: 20
  batch_size: 4
  workers: 8

wandb:
  project: patch_icl_3d_exps
  name: null
