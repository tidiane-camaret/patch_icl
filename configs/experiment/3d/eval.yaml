# @package _global_
# 3D in-context eval entrypoint (experiments/3d/eval.py, config_name=eval). Composes a
# dataset group; the model is chosen by eval.model (loaded by name in eval.py).
#   python experiments/3d/eval.py                                   # medverse on totalseg (test)
#   python experiments/3d/eval.py eval.model=native_resenc \
#       eval.checkpoint=results/checkpoints/resenc_in_context_best.pt
#   python experiments/3d/eval.py dataset=omnisynth3d eval.split=val   # eval on omniSynth-3D
defaults:
  - cluster: nfs
  - augmentations: multiverseg
  - dataset: totalseg
  - _self_
  - optional experiment:
hydra:
  searchpath:
    - file://${oc.env:PWD}/configs
eval:
  model: medverse             # medverse | native_resenc | native_vit | multilevel | nninteractive
  split: test
  n_subjects: 50
  batch_size: 8
  workers: 20
  seed: 0
  crop_jitter: null           # use_crop eval: null=T//4 jitter; 0=centered crops
  # Evaluate every sample at each of these physical crop spacings (mm/voxel), e.g.
  # [1.5, 2.5, 3.5], instead of the single data.crop_spacing_mm. Produces per-(class,
  # spacing) rows in eval.csv/json and class/<c>/mean_dice@<s> wandb scalars. Same
  # GFLOPs/sample at every spacing; wall time is len(list)x. null = single-spacing eval.
  # Requires data.use_crop=true and the totalseg source; pair with crop_jitter=0 for a
  # fully controlled sweep (centered crops, only spacing changes across passes).
  spacing_sweep: null
  # Coarse->fine localization metric layered on spacing_sweep. For each descending
  # consecutive pair (e.g. [4,2]), use the coarse (4mm) target prediction to place a
  # fine-spacing (2mm) box and measure |GT ∩ box| / |GT| (containment), plus an oracle
  # box on the GT centroid. Adds one soft-prob forward per non-final spacing. Requires a
  # spacing_sweep with a descending step (+ totalseg / use_crop). false = sweep only.
  spacing_locator: false
  save_figures: true
  max_figures: 200
  out_dir: ${paths.results}/3d_eval
  medverse_ckpt: null         # override Medverse.ckpt path; null = adapter default
  sw_roi_size: null           # sliding-window ROI; null = adapter default (128³)
  checkpoint: null            # trained best.pt (required for native_*/multilevel/nninteractive)
wandb:
  project: patch_icl_3d_eval  # null to disable
  name: null
