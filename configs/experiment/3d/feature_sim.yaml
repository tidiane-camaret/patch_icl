# @package _global_
# Feature-similarity study entrypoint (experiments/3d/feature_sim/run.py). Reuses the
# eval loader/checkpoint surface (eval.*) and adds a feature_sim.* sweep block.
#   python experiments/3d/feature_sim/run.py eval.model=patchset3d \
#       eval.checkpoint=results/checkpoints/<run>/best.pt eval.split=test
# Frozen pretrained encoder (no training, intrinsic metrics only, real_dice empty):
#   python experiments/3d/feature_sim/run.py eval.model=primus \
#       'feature_sim.tiers=[backbone]' 'feature_sim.resolutions=[8,16]'
#   (eval.primus_sidecar defaults to ${paths.colipri}/primus_colipri.json)
# Per eva-block depth sweep (one row per layer, tier bb:L{i}):
#       'feature_sim.tiers=[backbone_layers]'
defaults:
  - cluster: nfs
  - augmentations: multiverseg
  - dataset: totalseg
  # `model` group so train-time experiment presets (e.g. experiment=36_colipri_*, which do
  # `override /model: patchset3d`) compose here too. run.py rebuilds the real arch from the
  # checkpoint (_load_patchset) and dispatches on eval.model, so this group's arch/train
  # blocks are only a placeholder — never read by the primus path.
  - model: patchset3d
  - _self_
  - optional experiment:
hydra:
  searchpath:
    - file://${oc.env:PWD}/configs
eval:
  model: patchset3d           # patchset3d | primus (frozen nnUNet ViT, e.g. CoLiPri) | tap_ct (frozen tap-ct-b-3d)
  split: test
  n_subjects: null
  batch_size: 16
  workers: 8
  seed: 0
  out_dir: ${paths.results}/3d_feature_sim
  # Forward-path perf (feature extraction only; metrics stay fp32). autocast≈2.8x on the
  # frozen ViT, ~free; compile adds ~2.2x for a ~15-25s one-time warmup (worth it past a few
  # hundred tasks). Measured on exp 36: bench_compile.py. See docs/logs.md 2026-08-06.
  autocast: true             # bf16 autocast on model/encoder forwards (matches train/eval)
  compile: false             # torch.compile the transformer + frozen eva (opt-in; slow 1st batch)
  checkpoint: null            # REQUIRED for model=patchset3d: trained best.pt
  # model=primus: supply weights + arch via a sidecar written by
  # scripts/extract_colipri_backbone.py, or inline primus_kwargs/preproc below.
  weights: null               # plain Primus state_dict (.pt); null = random-init floor
  primus_sidecar: ${paths.colipri}/primus_colipri.json        # JSON: {primus_kwargs, preproc, weights}
  primus_kwargs: null         # inline alternative to the sidecar
  preproc: null               # {clip_min,clip_max,mean,std} HU re-normalisation
  # model=tap_ct: frozen fomofo/tap-ct-b-3d (weights on HF). tiers: backbone (final) or
  # backbone_layers (per-block bb:L{i} depth sweep). Needs data.image_size divisible by 8.
  # See TapCTEncoderAdapter / experiments/encoders/tapct_features.py.
  tapct:
    precision: bf16           # fp32 | bf16 | fp16
    to_lps: true              # RAS->LPS axial-first reorientation (matches TAP training frame)
    resize_native: true       # processor resize_dims=(T,T); false = stock 224^2 upsample
    pad_hu: null              # reset normalized-0 pad voxels to this HU (air=-1024); null=off
    compile_mode: default     # torch.compile mode when eval.compile=true (default|reduce-overhead|max-autotune)
    max_layers: null          # keep only the first N of 12 transformer blocks (cuts compute); null=all. ~7 often best
feature_sim:
  tiers: [stage:0, stage:1, stage:2, concat, img_embed, transformer_layers]
  resolutions: [16, 32, 48]     # >48^3 auto-switches to point mode
  budget: 262144 # = 64^3       110592  = 48^3; above this, uses point sampling
  n_fg: 512
  n_bg: 512
  band: null                        # null = BG anywhere; int = dilated shell (voxels)
wandb:
  project: patch_icl_feature_similarity   # null to disable (CSV still written)
  name: null
