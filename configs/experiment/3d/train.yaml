# @package _global_
# 3D in-context training entrypoint (experiments/3d/train.py, config_name=train).
#   python experiments/3d/train.py                       # medverse on totalseg
#   python experiments/3d/train.py dataset=omnisynth3d   # train on omniSynth-3D
#   python experiments/3d/train.py train.loss=bce_dice   # ad-hoc overrides
#   python experiments/3d/train.py experiment=<preset>   # ablation layer (e.g. 1_medverse_benchmark)
defaults:
  - cluster: nfs
  - augmentations: multiverseg
  - dataset: totalseg
  - model: medverse
  - _self_
  - optional experiment:
hydra:
  searchpath:
    - file://${oc.env:PWD}/configs
train:
  epochs: 100
  batch_size: 8
  workers: 8
  seed: 42
  eval_every: 1
  grad_clip: 1.0
  # Per-step wall-clock breakdown (patchset3d, CUDA): logs train/time/{data,encode,attn}_ms
  # (data-wait, image-encode, attention). CUDA events on encoder/transformer; ~free (loop
  # already syncs each step). false = off.
  profile_timing: false
  # Per-layer feature-matching trace at eval (patchset3d only): logs val/transfer_dice/{encoder,L0..}
  # + val/retrieval/* at res=R, tracing encoder(pre-attention)->transformer co-evolution. One hooked
  # forward per task over feature_sim_n_tasks val tasks. 0 = off; e.g. 5 = every 5 epochs.
  feature_sim_every: 0
  feature_sim_n_tasks: 128
  # train.checkpoint is the weight-source knob; its default is per-model (set in
  # model/*.yaml so it survives composition). medverse: orig_weights | random | <path>.
  # patchset3d: null=fresh | <path>=resume.
  out_dir: ${paths.results}/3d_train
eval:                           # per-class validation during training
  split: val
  n_subjects: 20
  batch_size: 8
  workers: 8
  crop_jitter: null             # use_crop eval: null=T//4 jitter; 0=centered (lets the
                                # frozen PrimusEncoder cache reuse crops within an epoch)
wandb:
  project: patchset_train
  name: null
