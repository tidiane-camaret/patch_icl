# Multilevel ICL experiment: coarse-to-fine PatchICLAttention.
# Loaded on top of configs/config.yaml + cluster config.
# Override from CLI: python train.py key=value  (dot-notation)

data:
  image_size: [128, 128, 128]
  resolutions:
    - [8, 8, 8]
    - [16, 16, 16]
    - [32, 32, 32]
    #- [64, 64, 64]
    #- [128, 128, 128]
  n_patches_l1: 512          # NP₁: number of sparse patches at L1
  sampling_temperature: 0.2  # Gumbel-TopK temperature (higher → more uniform sampling)
  target_sampling: predicted_entropy  # gt_previous_pred_error | gt_foreground_entropy_balanced | predicted_entropy
  context_size: 1
  max_ds_len_train: 2000
  mask_pool: avg             # how to pool masks to grid: max | avg
  synth_method: slic
  n_synth_merge_min: 1   # min number of adjacent SVs merged per label (inclusive)
  n_synth_merge_max: 5   # max number of adjacent SVs merged per label (inclusive)
  p_synth: 1
  class_balanced: true
  use_crop: true
  random_coloring: false
  num_labels_per_sample: 1
  train_classes: not_benchmark
  val_classes: benchmark
model:
  stunet_variant: base
  stunet_pretrained: ${paths.checkpoints}/stunet/base_statedict.pt
  feature_level: all         # encoder level: int index or 'all'
  dim: 256                   # internal transformer working dim
  num_heads: 8
  num_layers: 8
  ff_factor: 2
  label_injection: concat  # additive | concat | gate | none
  output_head: linear        # linear | mlp | retrieval
  pos_encoding: rope3d       # none | sinusoidal | learned | rope3d
  input_norm: rmsnorm        # none | rmsnorm | l2
  dropout: 0.1
  ctx_self_attn: true
  log_n_scaling: true
  log_n_base: 512
  # Context label encoding — two modes (pick one):
  #   CNN encoder : mask_cnn_dim > 0  — 3D ConvNet encodes the context mask at the finest
  #                                     resolution once, then interpolates to each level.
  #                                     label_injection (above) mixes the resulting embedding
  #                                     into context tokens.
  #   Scalar      : mask_cnn_dim = 0  — avg-pool value per patch fed directly to label_inject.
  mask_cnn_dim: 32
  soft_labels_train: true   # keep avg-pool [0,1] values as CNN/scalar input during training
  soft_labels_eval: false   # binarize to {0,1} at inference (cleaner signal)
  num_registers: 4          # register tokens appended to context K/V and cascaded between levels (0 = off)
  append_zero_attn: false   # add a null K/V slot to cross-attention so target patches can "abstain"
  detach_cascade_registers: true  # detach register gradients between levels (false = cross-level gradient coupling)
  shared_weights: true           # if true, one PatchICLAttention is shared across all levels (requires rope3d)
  use_scale_embed: true         # if true, inject ContinuousScaleEncoding(scale_mm) into PatchICLAttention
  use_role_embed: true          # if true, inject tgt/ctx type embeds + per-context-image index embeds
  max_context_size: 8            # upper bound on K for ctx_idx_embed table

train:
  loss_weights: [1.0, 1.0]   # weight for L0 and L1 losses
  epochs: 100
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 1.0e-5
  workers: 20
  val_items_per_class: 30
  nd_interval: 20
  seed: 42
  aug: true
  aug_preset: multiverseg_v2
  wandb_project: patch_icl_3d_exps
  run_name: null
  checkpoint: null
  device: null
  compile_model: false  # set true to enable torch.compile(reduce-overhead) — requires Python 3.11 + triton
