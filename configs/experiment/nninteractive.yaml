# NNInteractive encoder experiment: same multilevel attention stack,
# NNInteractiveEncoder (pretrained, frozen) instead of STUNetEncoder.
#
# Two mask injection modes (model.nnint_mask_injection):
#   ch1      — context mask in ch1 of the 8-channel encoder input.
#              No extra trainable params; exploits nnInteractive's native
#              "current segmentation" channel directly.
#   separate — image only in ch0; mask encoded by _Mask3DEncoder and fused
#              at the bottleneck.  0.04–0.43 M extra trainable params.
#
# num_stages controls depth (4→8×, 5→16×, 6→32× stride).
# Recommended: num_stages=5 for 128³ input → 8³ bottleneck (320-ch).

data:
  image_size: [128, 128, 128]
  resolutions:
    - [8, 8, 8]
    #- [16, 16, 16]
    #- [32, 32, 32]
  n_patches_l1: 512
  sampling_temperature: 0.2
  target_sampling: predicted_entropy  # gt_previous_pred_error | gt_foreground_entropy_balanced | predicted_entropy
  context_size: 1
  max_ds_len_train: 2000
  mask_pool: avg
  synth_method: seeds3d
  n_synth_merge_min: 1
  n_synth_merge_max: 5
  p_synth: 1
  class_balanced: true
  use_crop: true
  random_coloring: false
  num_labels_per_sample: 1
  train_classes: not_benchmark
  val_classes: benchmark

model:
  # ── NNInteractive encoder ────────────────────────────────────────────────
  nnint_ckpt: /home/dpxuser/model_checkpoints/nnint/nnInteractive_v1.0
  nnint_mask_injection: ch1    # ch1 | separate
  nnint_num_stages: 5          # 5 → 16× stride, bottleneck (B, 320, 8, 8, 8)
  # ── Attention stack (shared with multilevel) ─────────────────────────────
  feature_level: [2, 3, 4]     # int index | 'all' | list[int] — [2,3,4] skips large early stages
  dim: 256
  num_heads: 8
  num_layers: 4
  ff_factor: 2
  label_injection: concat      # additive | concat | gate | none
  output_head: linear
  pos_encoding: rope3d
  input_norm: rmsnorm
  dropout: 0.1
  ctx_self_attn: true
  log_n_scaling: true
  log_n_base: 512
  mask_cnn_dim: 0             # 0 = scalar label injection; >0 = MaskCNN
  soft_labels_train: true
  soft_labels_eval: false
  num_registers: 4
  append_zero_attn: false
  detach_cascade_registers: true
  shared_weights: true
  use_scale_embed: true
  use_role_embed: true
  max_context_size: 8

train:
  loss: dice_bce          # bce | dice_bce | dice_focal
  loss_weights: [1.0]
  epochs: 100
  batch_size: 12
  lr: 1.0e-4
  weight_decay: 1.0e-5
  workers: 20
  val_workers: 8          # separate low worker count for val; train workers cause NFS contention
  val_items_per_class: 30
  nd_interval: 20
  seed: 42
  aug: true
  aug_preset: multiverseg_v2
  wandb_project: patch_icl_3d_exps
  run_name: null
  checkpoint: null
  device: null
  compile_model: true   # torch.compile(default) on shared attention — kernel fusion speedup; reduce-overhead crashes due to cascade_registers None→tensor shape change across levels
