# Feature-attention experiment: frozen STU-Net encoder + PatchICLAttention head.
# Loaded on top of configs/config.yaml + cluster config.
# Override any value from the CLI: python train.py key=value  (dot-notation)

data:
  image_size: [128, 128, 128]
  output_size: [8, 8, 8]          # spatial grid fed to the attention model
  context_size: 1
  max_ds_len_train: 2000
  mask_pool: max                  # how to pool masks to output_size: max | avg
  synth_method: slic
  synth_unions: true
  p_synth: 1
  class_balanced: true
  use_crop: true
  random_coloring: false
  num_labels_per_sample: 1
  train_classes:
    - liver
    - lung_lower_lobe_right
    - lung_lower_lobe_left
    - lung_upper_lobe_right
    - lung_upper_lobe_left
    - lung_middle_lobe_right
    - small_bowel
    - heart
    - autochthon_left
    - autochthon_right
    - hip_left
    - hip_right
    - aorta
    - brain
    - skull
  val_classes:
    - colon
    - stomach
    - spleen
    - gluteus_maximus_right
    - gluteus_maximus_left
    - gluteus_medius_left
    - gluteus_medius_right
    - iliopsoas_left
    - iliopsoas_right
    - costal_cartilages
    - urinary_bladder
    - femur_left
    - femur_right
    - sacrum
    - kidney_left

model:
  stunet_variant: base
  stunet_pretrained: ${paths.checkpoints}/stunet/base_statedict.pt
  feature_level: all              # encoder level: int index or 'all'
  dim: 512                        # internal transformer working dim (projected from embed_dim)
  num_heads: 8
  num_layers: 4
  ff_factor: 2
  label_injection: additive       # additive | concat | gate | none
  output_head: linear             # linear | mlp | retrieval
  pos_encoding: sinusoidal        # none | sinusoidal | learned
  input_norm: rmsnorm             # none | rmsnorm | l2
  dropout: 0.1
  ctx_self_attn: true
  log_n_scaling: true
  log_n_base: 512                 # reference context size for log-n scaling (1×8³)
  soft_labels: false              # use when data.mask_pool=avg true → Linear(1,dim,bias=False) instead of Embedding(2,dim)

train:
  epochs: 100
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 1.0e-5
  workers: 18
  val_items_per_class: 50
  nd_interval: 20                 # compute train norm_dice every N batches
  seed: 42
  aug: true
  aug_preset: nnunet              # multiverseg | nnunet
  wandb_project: patch_icl_3d_exps
  run_name: null
  checkpoint: null
  device: null                    # null = auto-detect cuda/cpu
