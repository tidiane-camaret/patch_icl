model: patchset_pfn

data:
  image_size: 128
  context_size: 3
  dataset: null
  max_train_samples: null

sample:
  resolutions: [16, 32, 64, 128]   # coarse→fine ladder; resolutions[0] MUST equal stage-1 res (asserted)
  grid_res: 32        # DEPRECATED single-level alias; kept only for the diagnostic scripts
  # Patch selection: threshold boundary core + fixed fg-core quota + blurred neighbor fill.
  # Budgets are PER HOP (len == len(resolutions)-1). Coverage fraction shrinks with resolution.
  n_total:       [320, 320, 320]    # M: total patches sampled per image, per hop
  n_fg_core:     [94, 94, 94]       # fg-core quota (target) per hop
  n_fg_core_ctx: [160, 160, 160]    # context support: heavier fg quota (context relies on TRUE GT)
  tau: 0.30           # boundary core: cells with |value-0.5| < tau  (shared across hops)
  blur_sigma: 1.0     # neighbor proximity field width (grid cells)
  floor: 0.005        # uniform floor → far cells keep a chance
  temperature: 1.0    # gumbel temperature for the neighbor fill
  eval_deterministic: true   # drop gumbel at eval for reproducible metrics
  # Sampling map: which signal ranks cells for query selection (|value-0.5|).
  #   prev_pred : previous-level (stage-1 coarse) prediction — deployable, no label access
  #   ds_gt     : downsampled target GT — oracle, leaks labels (upper-bound study only)
  train: prev_pred    # prev_pred | ds_gt
  eval: prev_pred     # prev_pred | ds_gt

arch:
  feature_level: all  # UniverSeg encoder level → feature_dim 256
  mask_prior: patch  # false | scalar | patch — mask-token form.
                      #   false : scalar; query prior = support-mean (neutral)
                      #   scalar: scalar; query prior = stage-1 coarse pred
                      #   patch : p×p mask tile (p = image_size//grid_res, auto); support =
                      #           native GT tile, query = upsampled coarse tile
  use_stage1_thinking: true  # attend to stage-1's post-transformer thinking rows (pooled → memory tokens)
  query_self_attn: true      # let query patches attend to each other (within-image spatial reasoning via Fourier PE)
  fourier_bands: 8
  e: 256
  h: 512
  l: 6
  a: 4
  thinking_rows: 8
  residual_decay: 0.95
  compile: true       # graph-breaks at the frozen encoder (as in pfn_seg)

train:
  epochs: 200
  batch_size: 32
  lr: 1.0e-3
  grad_clip: 2.0
  dice_weight: 1.0
  loss_weights: [1.0, 1.0, 1.0]   # per hop (len == len(resolutions)-1)
  lawa_k: 10
  muon_lr_scale: 0.1
  muon_momentum: 0.96
  muon_wd: 0.1
  adam_wd: 0.01
  warmup_epochs: 5
  eval_every: 1
  workers: 16
  seed: 42
  checkpoint: null    # warm-start for PatchSetPFN (not the stage-1 model)
  stage1_checkpoint: results/2d/pfn_seg_universeg/pfn_seg_USegall_R16q8_e256_l6_k3_think8/best.pt

eval:
  batch_size: 16
  workers: 8
  max_per_label: 20
  out_dir: /nfs/data/nii/data1/Analysis/camaret___in_context_segmentation/ANALYSIS_20251122/results/patch_icl/2d

wandb:
  project: patch_icl_2d_exps_train
  name: null
  enabled: true

# mirrors configs/augmentations/medsegbench.yaml
aug:
  enabled: true
  geometric: { hflip_p: 0.5, vflip_p: 0.5, rotate: { p: 0.5, max_angle_deg: 20.0 } }
  intensity:
    brightness: { p: 0.5, max_delta: 0.15 }
    contrast:   { p: 0.5, range: [0.8, 1.2] }
    gamma:      { p: 0.3, range: [0.75, 1.33] }
    noise:      { p: 0.3, std: 0.04 }
