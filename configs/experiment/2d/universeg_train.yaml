# Fine-tune UniverSeg on omniSynth. All shared params (data/train/eval/wandb + the
# omniglot synth block) come from omnisynth_train_base.yaml; UniverSeg-specific keys
# (lr/pretrained/ds_metric_res) now live in the `model/universeg` group. Override the
# generator at the CLI, e.g.:
#   python experiments/2d/train.py synth.scene.target_mode=mix
defaults:
  - omnisynth_train_base
  - model: universeg
  - _self_

model: universeg             # (also set by the group; kept for grep-ability)
