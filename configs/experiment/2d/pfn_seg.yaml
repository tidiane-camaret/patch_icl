defaults:
  - synth: default   # controlSynth config block -> cfg.synth (used when data.source=synthetic)
  - _self_

model: pfn_seg_2d

data:
  source: medsegbench  # medsegbench | biomedparse | synthetic (controlSynth generator)
  image_size: 128
  context_size: 3
  dataset: null       # null = all datasets; or e.g. "abdomenus"
  max_train_samples: null  # null = full dataset; int = random subset per epoch

arch:
  image_encoder: universeg  # image path: "patch" (raw pixels), "universeg", or "dinov3"/"dinov3-large" (frozen pretrained features)
  feature_level: all    # encoder level: 0..3, -1 (bottleneck), or "all" (concat). UniverSeg all → 256ch; DINOv3 all → 1920ch
  encoder_resize_to_input: false  # if true, resize images to 128² before the (fully-conv) encoder; false = encode at native size
  encoder_imagenet_norm: true     # dinov3 only: ImageNet-normalize the (gray→RGB) input
  encoder_reduce: none            # dinov3 only: channel reduction after pooling — none | grouppool:<d> | random:<d> | pca:<d>
  encoder_stage_l2norm: false     # dinov3 only: L2-norm each stage before the "all" concat
  resolution: 16        # patches per side; output grid Hp = resolution, N = resolution² patches.
                        # Effective patch size P = image_size // resolution (128//16 = 8).
  input_patch_size: 8   # Q; every native P×P patch is resized to Q×Q before embedding (mask path; image path when image_encoder=patch).
  e: 256
  h: 512
  l: 6
  a: 4
  thinking_rows: 8
  residual_decay: 0.95
  compile: true      # torch.compile (slow first batch due to Triton kernel compilation)

train:
  epochs: 200
  batch_size: 32
  lr: 1.0e-3
  grad_clip: 2.0
  dice_weight: 1.0    # weight of soft-Dice term added to patch-level soft BCE
  lawa_k: 10          # LAWA checkpoint buffer size
  muon_lr_scale: 0.1  # Muon lr = muon_lr_scale * lr
  muon_momentum: 0.96
  muon_wd: 0.1
  adam_wd: 0.01
  warmup_epochs: 5
  eval_every: 1      # run val eval every N epochs
  workers: 16
  seed: 42
  checkpoint: null   # path to warm-start weights (bare state_dict or {"model": ...})

eval:
  batch_size: 16
  workers: 8
  max_per_label: null #20
  out_dir: /nfs/data/nii/data1/Analysis/camaret___in_context_segmentation/ANALYSIS_20251122/results/patch_icl/2d_train
wandb:
  project: patch_icl_2d_exps_train
  name: null          # null = auto-generated
  enabled: true

# mirrors configs/augmentations/medsegbench.yaml
aug:
  enabled: true
  geometric:
    hflip_p: 0.5
    vflip_p: 0.5
    rotate:
      p: 0.5
      max_angle_deg: 20.0
  intensity:
    brightness:
      p: 0.5
      max_delta: 0.15
    contrast:
      p: 0.5
      range: [0.8, 1.2]
    gamma:
      p: 0.3
      range: [0.75, 1.33]
    noise:
      p: 0.3
      std: 0.04
