# Train PatchSetCNN — a simple low-resolution in-context segmentation model — on
# omniSynth (omniglot glyphs by default). Shared params (data/train/eval/wandb + the
# omniglot synth block) come from omnisynth_train_base.yaml; the model's arch + optimizer
# defaults now live in the `model/patchset_cnn` group (shared with 1_omnisynth_medseg).
#
#   python experiments/2d/train.py --config-name patchset_cnn_train
#   python experiments/2d/train.py --config-name patchset_cnn_train \
#       synth.scene.target_mode=mix arch.resolution=16
defaults:
  - omnisynth_train_base
  - model: patchset_cnn
  - _self_

model: patchset_cnn          # (also set by the group; kept for grep-ability)
