defaults:
  - synth: default   # controlSynth config block -> cfg.synth (used when data.source=synthetic)
  - _self_

model: universeg

data:
  source: medsegbench  # medsegbench | biomedparse | synthetic (biomedparse has only train/test splits)
  image_size: 128      # loads {dataset}_{image_size}.npz files
  context_size: 3
  split: val
  dataset: null        # null = all datasets; or e.g. abdomenus

eval:
  batch_size: 16
  workers: 30
  seed: 0
  out_dir: /nfs/data/nii/data1/Analysis/camaret___in_context_segmentation/ANALYSIS_20251122/results/patch_icl/2d_eval
  max_per_label: 100 #20  # max samples per (dataset, label_value); null = all
  checkpoint: null   # pfn_seg_2d / patchset_pfn: path to a trained best.pt (arch read from it)
  stage1_checkpoint: null  # patchset_pfn only: frozen stage-1 ImagePFN best.pt (fallback if not stored in checkpoint)
  encode_size: null  # pfn_seg_2d / patchset_pfn: feed images at this size, token grids stay at ckpt size (Strategy A); null = ckpt size
  patch_csv: null    # pfn_seg_2d only: path to dump per-patch error analysis CSV; null = off
  synth_csv: null    # data.source=synthetic only: path to dump per-element synth-param CSV; null = off
  save_figures: true   # all backends: save qualitative PNGs (one per dataset/label) to out_dir
  max_figures: 200      # cap on total figures saved when save_figures=true
  figures_to_wandb: false  # also upload the saved figures to wandb (false = local out_dir only)


wandb:
  project: patch_icl_2d_exps
  name: null           # null = auto
