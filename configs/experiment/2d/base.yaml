model: universeg

data:
  source: medsegbench  # medsegbench | biomedparse (biomedparse has only train/test splits)
  image_size: 128      # loads {dataset}_{image_size}.npz files
  context_size: 3
  split: val
  dataset: null        # null = all datasets; or e.g. abdomenus

eval:
  batch_size: 16
  workers: 30
  seed: 0
  out_dir: results/2d/outputs
  max_per_label: null #20  # max samples per (dataset, label_value); null = all
  checkpoint: null   # pfn_seg_2d / patchset_pfn: path to a trained best.pt (arch read from it)
  stage1_checkpoint: null  # patchset_pfn only: frozen stage-1 ImagePFN best.pt (fallback if not stored in checkpoint)
  encode_size: null  # pfn_seg_2d / patchset_pfn: feed images at this size, token grids stay at ckpt size (Strategy A); null = ckpt size
  patch_csv: null    # pfn_seg_2d only: path to dump per-patch error analysis CSV; null = off

wandb:
  project: patch_icl_2d_exps
  name: null           # null = auto
