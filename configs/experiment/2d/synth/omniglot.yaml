# omniSynth generator (only used when data.source=omnisynth). In-context Omniglot:
# a 4x4 grid of characters; k cells hold the target class (mask = ink pixels of
# the target characters within those cells), the rest are distractors.
# See docs/superpowers/specs/2026-06-29-omnisynth-design.md.
# Reuses the `synth` package slot, so set data.source=omnisynth to select it.
# @package synth
diversity:
  master_seed: 42
  train_zip: images_background.zip   # 30 background alphabets -> train
  eval_zip: images_evaluation.zip    # 20 evaluation alphabets -> val/test
  val_test_split: 1                # fraction of eval classes -> val (rest -> test)
scene:
  grid: 4                # grid x grid cells fill the canvas (image_size must divide by grid)
  placement: grid        # grid: glyphs on cell centres. random: uniform-random positions
                         # (may overlap). Glyph count is the same either way.
  max_nb_objects: 0      # cap on total glyphs (targets + distractors); 0 = no cap (fill all
                         # grid*grid). Filled cells are a random subset; applies to both modes.
  k_min: 1               # target cells ~ U[k_min, k_max]
  k_max: 1
  cell_margin: -0.15     # glyph size = (1-2*margin)*cell. <0 -> glyphs larger than their cell,
                         # overflowing into neighbours (union-blended) for more ink / training
                         # signal with small tolerable overlap. 0.1=old inset, 0=fill cell.
  target_mode: aug     # identical | aug | class  (what "same target" means)
  aug_rotate: 20.0       # deg; aug-mode per-placement jitter
  aug_scale: 0.2         # +/- log2 scale
  aug_translate: 0.2     # fraction of cell
  p_copy: 0.9            # instCopy (train only): per-item prob of injecting copy slot(s); 0 disables
  n_copy: 3              # number of context slots overwritten with an EXACT copy of the query scene (clamped to K)
sampling:
  epoch_length: 10000
  eval_subjects_per_task: 50
  eval_seed_namespace: 0
