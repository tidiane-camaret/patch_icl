# @package _global_
# STU-Net-B encoder (frozen, pretrained on TotalSegmentator) + nnUNet augmentations.
# Otherwise identical to experiment 1_nnunet_augs.
#
# Key differences vs. 1_nnunet_augs:
#   - encoder: stunet (6-stage, 32× downsample) instead of resenc (4-stage, 8×)
#   - image_size: 128³ (required — stunet bottleneck at 64³ is only 2³ = 8 tokens)
#   - stunet image encoder is frozen; only mask encoder + transformer + decoder are trained
#   - mask_fusion: additive (zero target mask → no bias on target bottleneck)
#
# Bottleneck grid: 128/32 = 4³ = 64 tokens  (vs. 64/8 = 8³ = 512 for resenc at 64³)
# Adjust rope_theta if attention quality is poor at this grid size.

data:
  image_size: [128, 128, 128]
  synth_method: null
  p_synth: 0.0
  use_crop: true
  max_ds_len_train: 5000

model:
  encoder: stunet
  stunet_variant: base
  stunet_pretrained: ${paths.checkpoints}/stunet/base_statedict.pt
  stunet_freeze: true
  mask_fusion: additive
  stunet_num_stages: 4
  model.num_registers: 1
  model.num_context_layers: 6

augmentations:
  task:
    affine:
      p: 0.2
      max_angle_deg: 30.0
      scale_min: 0.70
      scale_max: 1.40
      max_translate: 0.0
    elastic:
      p: 0.0

  intensity:
    brightness_contrast:
      p: 0.15
      brightness: 0.0
      contrast_range: [0.75, 1.25]
      preserve_range: true
    gamma:
      p: 0.30
      range: [0.70, 1.50]
      retain_stats: true
    gaussian_noise:
      p: 0.10
      max_std: 0.316
    gaussian_blur:
      p: 0.20
      sigma_range: [0.50, 1.00]
    simulate_low_resolution:
      p: 0.25
      scale_min: 0.5
      scale_max: 1.0
