# @package _global_
augmentations:
  enabled: true

  # -----------------------------------------------------------------------
  # Task augmentations  —  nnUNet-style geometric transforms
  # -----------------------------------------------------------------------
  task:
    flip:
      p_d: 0.5
      p_h: 0.5
      p_w: 0.5

    affine:
      p: 0.2
      max_angle_deg: 30.0
      scale_min: 0.70
      scale_max: 1.40
      max_translate: 0.0

    elastic:
      p: 0.0                      # disabled (nnUNet uses elastic only for some configs)
      alpha: 0.12
      grid_scale: 8

  # -----------------------------------------------------------------------
  # Per-image geometric augmentations  —  INDEPENDENT transform per volume
  # (unlike `task`, which shares one transform across all K+1 volumes to keep the
  # target/context correspondence). Consumed by data.self_context.augs.per_image to jitter the
  # self-context copy's pose. Default OFF (all p=0) → no-op.
  # -----------------------------------------------------------------------
  per_image:
    flip:
      p_d: 0.0
      p_h: 0.0
      p_w: 0.0
    affine:
      p: 0.0
      max_angle_deg: 30.0
      scale_min: 0.85
      scale_max: 1.15
      max_translate: 0.1
    elastic:
      p: 0.0
      alpha: 0.12
      grid_scale: 8

  # -----------------------------------------------------------------------
  # Intensity augmentations  —  nnUNet defaults (already per-image)
  # -----------------------------------------------------------------------
  intensity:
    hu_jitter: 0

    # GIN / IPA appearance transform (Ouyang et al., causality-inspired DG).
    # Randomly-weighted nonlinear conv warps intensities; mode=ipa additionally
    # blends independent copies with a smooth field. Independent per volume.
    # Default OFF (p=0) → no-op for existing runs.
    gin:
      p: 0.0
      mode: ipa                  # gin | ipa
      n_layer: 4
      interm_channel: 2
      scale_pool: [1, 3]
      out_norm: frob
      ipa_copies: 2
      ipa_control_points: 4

    brightness_contrast:
      p: 0.15
      brightness: 0.0
      contrast_range: [0.75, 1.25]
      preserve_range: true

    gamma:
      p: 0.30
      range: [0.70, 1.50]
      retain_stats: true

    gaussian_noise:
      p: 0.10
      max_std: 0.316              # ≈ sqrt(0.1), nnUNet default noise variance

    gaussian_blur:
      p: 0.20
      sigma_range: [0.50, 1.00]

    simulate_low_resolution:
      p: 0.25
      scale_min: 0.5
      scale_max: 1.0

  # -----------------------------------------------------------------------
  # Synth augmentations  —  same as multiverseg (used when p_synth > 0)
  # -----------------------------------------------------------------------
  synth:
    flip_d: 0.5
    flip_h: 0.5
    flip_w: 0.5

    affine:
      p: 0.8
      max_angle_deg: 25.0
      scale_min: 0.90
      scale_max: 1.50
      max_translate: 0.20

    elastic:
      p: 0.8
      alpha_range: [1, 10]
      sigma_range: [8, 15]

    brightness_contrast:
      p: 0.5
      brightness: 0.10
      contrast_range: [0.5, 1.5]

    sharpness:
      p: 0.5
      factor: 5.0

    gaussian_blur:
      p: 0.5
      sigma_range: [0.1, 1.5]

    gaussian_noise:
      p: 0.5
      mean_range: [0.0, 0.05]
      std_range:  [0.0, 0.05]
