# @package _global_
augmentations:
  enabled: true
  # Run augmentation on GPU in the training loop (src/gpu_augment.GpuAugmentor)
  # instead of per-item on CPU workers. When true the dataset emits raw volumes
  # + aug_mode and skips apply_*_aug. Default false (CPU path).
  gpu: false

  # -----------------------------------------------------------------------
  # Task augmentations  —  nnUNet-style geometric transforms
  # -----------------------------------------------------------------------
  task:
    flip:
      p_d: 0.5
      p_h: 0.5
      p_w: 0.5

    affine:
      p: 0.2
      max_angle_deg: 30.0
      scale_min: 0.70
      scale_max: 1.40
      max_translate: 0.0

    elastic:
      p: 0.0                      # disabled (nnUNet uses elastic only for some configs)
      alpha: 0.12
      grid_scale: 8

    # Diffeomorphic deform (SVF + scaling-and-squaring). Guaranteed invertible —
    # no folding, so masks stay valid (unlike `elastic`). Supersedes elastic;
    # opt in with deform.p>0 (and set elastic.p=0). Default OFF → no-op.
    deform:
      p: 0.0
      control_points: 6           # velocity grid nodes PER AXIS (a COUNT, not voxels) →
                                  # correlation length is a fixed fraction of the crop, so it's
                                  # resolution-invariant across our 128³ crops at 1–4mm.
      max_disp: 0.15              # velocity std, normalized grid units; calibrated to real
                                  # inter-case nonrigid deform (RMS med 0.14 at 6 ctrl pts,
                                  # experiments/3d/deform_stats/assess_svf.py)
      num_steps: 6                # scaling-and-squaring integration steps (raise to 7-8 if max_disp≥0.2)

  # -----------------------------------------------------------------------
  # Per-image geometric augmentations  —  INDEPENDENT transform per volume
  # (unlike `task`, which shares one transform across all K+1 volumes to keep the
  # target/context correspondence). Applied per-volume in BOTH the real-context path
  # (after task aug, to target + all K contexts) and the self_context path
  # (data.self_context.augs.per_image, to jitter the clone's pose). Default OFF
  # (all p=0) → no-op, so existing runs are unchanged.
  # -----------------------------------------------------------------------
  per_image:
    flip:
      p_d: 0.0
      p_h: 0.0
      p_w: 0.0
    affine:
      p: 0.0
      max_angle_deg: 30.0
      scale_min: 0.85
      scale_max: 1.15
      max_translate: 0.1
    elastic:
      p: 0.0
      alpha: 0.12
      grid_scale: 8
    deform:
      p: 0.0
      control_points: 6
      max_disp: 0.15
      num_steps: 6

  # -----------------------------------------------------------------------
  # Intensity augmentations  —  nnUNet defaults (already per-image)
  # -----------------------------------------------------------------------
  intensity:
    hu_jitter: 0

    # GIN / IPA appearance transform (Ouyang et al., causality-inspired DG).
    # Randomly-weighted nonlinear conv warps intensities; mode=ipa additionally
    # blends independent copies with a smooth field. Independent per volume.
    # Default OFF (p=0) → no-op for existing runs.
    gin:
      p: 0.0
      mode: ipa                  # gin | ipa
      n_layer: 4
      interm_channel: 2
      scale_pool: [1, 3]
      out_norm: frob
      ipa_copies: 2
      ipa_control_points: 4

    brightness_contrast:
      p: 0.15
      brightness: 0.0
      contrast_range: [0.75, 1.25]
      preserve_range: true

    gamma:
      p: 0.30
      range: [0.70, 1.50]
      retain_stats: true

    gaussian_noise:
      p: 0.10
      max_std: 0.316              # ≈ sqrt(0.1), nnUNet default noise variance

    gaussian_blur:
      p: 0.20
      sigma_range: [0.50, 1.00]

    simulate_low_resolution:
      p: 0.25
      scale_min: 0.5
      scale_max: 1.0

  # -----------------------------------------------------------------------
  # Synth augmentations  —  same as multiverseg (used when p_synth > 0)
  # -----------------------------------------------------------------------
  synth:
    flip_d: 0.5
    flip_h: 0.5
    flip_w: 0.5

    affine:
      p: 0.8
      max_angle_deg: 25.0
      scale_min: 0.90
      scale_max: 1.50
      max_translate: 0.20

    elastic:
      p: 0.8
      alpha_range: [1, 10]
      sigma_range: [8, 15]

    deform:
      p: 0.0                      # opt-in diffeomorphic alternative to synth elastic
      control_points: 8           # more nodes → more local warp (heavy synth divergence)
      max_disp: 0.15
      num_steps: 6

    brightness_contrast:
      p: 0.5
      brightness: 0.10
      contrast_range: [0.5, 1.5]

    sharpness:
      p: 0.5
      factor: 5.0

    gaussian_blur:
      p: 0.5
      sigma_range: [0.1, 1.5]

    gaussian_noise:
      p: 0.5
      mean_range: [0.0, 0.05]
      std_range:  [0.0, 0.05]
