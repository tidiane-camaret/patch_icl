enabled: true

# Applied jointly to (image, mask) — context pairs only; query GT is not transformed
geometric:
  hflip_p: 0.5
  vflip_p: 0.5
  rotate:
    p: 0.5
    max_angle_deg: 20.0

# Applied independently to every image (context + query); masks unchanged
intensity:
  brightness:
    p: 0.5
    max_delta: 0.15
  contrast:
    p: 0.5
    range: [0.8, 1.2]
  gamma:
    p: 0.3
    range: [0.75, 1.33]
  noise:
    p: 0.3
    std: 0.04
