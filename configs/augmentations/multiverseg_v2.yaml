# @package _global_
augmentations:
  enabled: true

  # -----------------------------------------------------------------------
  # Task augmentations  —  same random params applied to query + all context.
  # Stronger than multiverseg.yaml but not as aggressive as synth_equiv:
  # synth_equiv's p=0.8 shared elastic was too heavy (shared distortion ≠
  # the independent-per-copy deformation that makes synth aug effective).
  # -----------------------------------------------------------------------
  task:
    flip:
      p_d: 0.5
      p_h: 0.5
      p_w: 0.5

    affine:
      p: 0.8
      max_angle_deg: 25.0           # ↑ from ±15° (multiverseg) → nnUNet-equivalent strength
      scale_min: 0.80               # ↑ wider range [0.80, 1.40] (nnUNet v2 validated max)
      scale_max: 1.40
      max_translate: 0.15           # ↑ from 0.10

    elastic:
      p: 0.5                        # ↑ from 0.3; NOT 0.8 — synth_equiv showed heavy shared elastic hurts
      alpha: 0.12                   # unchanged — moderate deformation magnitude
      grid_scale: 8                 # unchanged

  # -----------------------------------------------------------------------
  # Intensity augmentations  —  independently sampled per volume.
  # Gamma kept (synth_equiv dropped it; that was a mistake for real labels).
  # simulate_low_resolution enabled (nnUNet v2 uses p=0.25; validated for
  # variable-resolution data like TotalSegMRI).
  # -----------------------------------------------------------------------
  intensity:
    hu_jitter: 0
    brightness_contrast:
      p: 0.50
      brightness: 0.10
      contrast_range: [0.75, 1.30]  # ↑ slightly wider than multiverseg [0.80, 1.20]
      preserve_range: false

    gamma:
      p: 0.30
      range: [0.70, 1.50]
      retain_stats: false

    gaussian_noise:
      p: 0.30                       # ↓ from 0.50 — high noise on every volume hurts context matching
      max_std: 0.05

    gaussian_blur:
      p: 0.50
      sigma_range: [0.50, 1.50]

    simulate_low_resolution:
      p: 0.15                       # ↑ enabled (was 0.0); simulates thick-slice / variable-res CT/MRI
      scale_min: 0.5
      scale_max: 1.0

  # -----------------------------------------------------------------------
  # Goal-mask transform  —  rewrites a task's TARGET + every CONTEXT mask with ONE shared
  # op, redefining the segmentation goal ("segment the eroded organ" / "...the boundary").
  # Runs after the geometric warp, TRAIN only (eval passes no augmentor), replayed
  # identically across cascade levels. Radii are mm -> voxels via the crop pitch, so an op
  # is the same physical size at every cascade level and invariant to cascade_crop_jitter.
  # One parameter draw per BATCH (per_task=true -> one per task; G extra pooling calls).
  # p=0.0 -> off, byte-identical. See src/mask_transforms.py.
  # -----------------------------------------------------------------------
  goal_mask:
    p: 0.0
    per_task: false
    ball: false                    # true -> Euclidean ball structuring element (slower, isotropic)
    ops: [dilate, erode]           # sampled uniformly; also: boundary, sobel
    dilate:   {radius_mm: [1.0, 4.0]}
    # min_keep: erosion never removes more than (1 - min_keep) of a mask's foreground,
    # per mask, so small organs keep a core instead of vanishing (0.0 = no floor).
    erode:    {radius_mm: [1.0, 4.0], min_keep: 0.3}
    boundary: {width_mm:  [1.0, 3.0], min_keep: 0.3}
    # sobel takes no parameters (3D Sobel gradient magnitude, per-sample normalised)

  # -----------------------------------------------------------------------
  # Synth augmentations  —  unchanged (used when p_synth > 0)
  # -----------------------------------------------------------------------
  synth:
    flip_d: 0.5
    flip_h: 0.5
    flip_w: 0.5

    affine:
      p: 0.8
      max_angle_deg: 25.0
      scale_min: 0.90
      scale_max: 1.50
      max_translate: 0.20

    elastic:
      p: 0.8
      alpha_range: [1, 10]
      sigma_range: [8, 15]

    brightness_contrast:
      p: 0.5
      brightness: 0.10
      contrast_range: [0.5, 1.5]

    sharpness:
      p: 0.5
      factor: 5.0

    gaussian_blur:
      p: 0.5
      sigma_range: [0.1, 1.5]

    gaussian_noise:
      p: 0.5
      mean_range: [0.0, 0.05]
      std_range:  [0.0, 0.05]

    gamma:
      p: 0.30
      range: [0.70, 1.50]

    simulate_low_resolution:
      p: 0.15
      scale_min: 0.5
      scale_max: 1.0
