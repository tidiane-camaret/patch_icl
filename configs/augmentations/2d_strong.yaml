# Strong 2D in-context aug preset — superset of 2d.yaml, adding the
# literature-backed transforms for cross-modality / OOD-task generalization
# (UniverSeg two-tier aug, Iris query perturbation, SynthICL bias field).
# Consumed via cfg.aug by augment() in experiments/2d/pfn_train.py.
# Use with:  aug_preset=2d_strong
#
# A/B vs 2d.yaml through the synth/benchmark harness before adopting: the
# literature rarely isolates per-augmentation effect, and gains here may be
# augmentation *strength* rather than a specific transform (see project_aug_benchmark).
enabled: true

# ── Task augmentation: one transform shared across the whole episode (all K+1) ──
# Intensity-only so the query image can be touched without desyncing its GT.
# Drives generalization to far-from-training tasks (UniverSeg's key finding).
task:
  invert:
    p: 0.2          # episode-wide intensity inversion (img -> 1 - img)

# ── In-task geometric: independent per CONTEXT entry; (image, mask) jointly. ────
# Never applied to the query (target is read from the un-augmented batch).
geometric:
  hflip_p: 0.1
  vflip_p: 0.1
  rotate:
    p: 0.5
    max_angle_deg: 45.0
  scale:            # zoom factor on the sampling grid (UniverSeg/Iris use ~0.9–1.1)
    p: 0.5
    range: [0.85, 1.15]
  translate:        # shift as a fraction of half-extent in normalized coords
    p: 0.5
    max_frac: 0.1
  crop:             # random-resized crop: sample an in-bounds sub-window, resize to full
    p: 0.5
    min_scale: 0.75  # smallest crop = 0.75 of (H, W); window ∈ [0.75, 1.0], never padded
  elastic:          # smooth random displacement field; alpha in normalized units
    p: 0.3
    alpha: 0.06
    downscale: 8    # field drawn at H/8 then upsampled (controls smoothness)

# ── In-task intensity: independent per image (context + query); masks unchanged ─
intensity:
  brightness:
    p: 0.5
    max_delta: 0.2
  contrast:
    p: 0.5
    range: [0.75, 1.3]
  gamma:
    p: 0.4
    range: [0.7, 1.5]
  bias_field:       # smooth multiplicative inhomogeneity (SynthICL); exp(field*strength)
    p: 0.3
    max_strength: 0.3
    downscale: 8
  noise:
    p: 0.3
    std: 0.05

# ── Query perturbation: extra independent noise on the query only (Iris) ───────
# Simulates an imperfect reference; intensity-only so GT stays valid.
query_perturb:
  p: 0.2
  noise_std: 0.05

# NOTE: random class dropout (Iris) is a *dataset-level* op, not an augment() knob.
# Each sample here is already a single (dataset, target) episode, so it does not apply.
