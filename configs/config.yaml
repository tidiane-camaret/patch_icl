defaults:
  - _self_
  - augmentations: multiverseg
  - cluster: nfs
  - experiment: null   # e.g. experiment=1_no_synth


paths:
  checkpoints:  ${paths.results}/checkpoints
  totalsegmri:  ???   # set in cluster config
  omniglot: /home/dpxuser/repos/omniglot/python   # dir holding images_background.zip / images_evaluation.zip

data:
  source: totalseg    # totalseg | totalsegmri  (3D build_dataset dispatch, experiments/3d/common.py)
  dataset: totalseg   # totalseg | totalsegmri
  # Use split names from label_stats.csv ("train" / "val"), or an explicit list.
  train_classes: train
  val_classes:   val
  image_size: [64, 64, 64] # [128, 128, 128] 
  context_size: 3
  max_train_subjects: null   # int to limit for debugging, e.g. 50
  max_val_subjects: null     # int to limit for debugging, e.g. 50
  max_ds_len_train: 10000     # cap samples per epoch (reshuffled each epoch); null = full dataset
  synth_method: slic         # grid | watershed | slic | seeds3d | null = disabled
  synth_unions: true        # use label_synth_<method>_union.npy instead
  p_synth: 0.5               # fraction of train items from synth path; 1.0 = synth-only
  class_balanced: true      # sample class uniformly first, then subject; prevents large classes dominating
  use_crop: false           # crop native-res ct.npy/label.npy instead of loading pre-resized files (~8× slower on NFS)

model:
  name: resenc_in_context   # resenc_in_context | vit_in_context
  # ResEncInContext3D — encoder selection
  encoder: resenc           # resenc | stunet
  # resenc options
  features_per_stage: [32, 64, 128, 256]   # nnUNetResEncM default; last = bottleneck width
  # stunet options (only used when encoder=stunet)
  stunet_variant: base      # small | base | large | huge
  stunet_pretrained: null   # path to STU-Net checkpoint (.model or .pt); null = random init
  stunet_freeze: false      # freeze STU-Net image encoder after loading pretrained weights
  stunet_num_stages: null   # null = all 6 stages (32× stride); 4 = 8× stride (matches ResEnc at 64³)
  mask_fusion: additive     # additive | concat  (how mask features join image features at bottleneck)
  # transformer
  rope_theta: 100.0         # RoPE base frequency; use ~100 for small grids (≤32 tokens/axis)
  depth_stage1: 6
  depth_stage2: 6
  num_heads: 8
  mlp_ratio: 4
  dropout: 0.1
  # token conditioning (PatchICL-style)
  num_registers: 0        # global KV tokens appended to Stage-2 context; 0 = disabled
  num_context_layers: 0   # extra self-attn layers applied to ctx tokens before Stage 1
  # ViTInContext3D
  patch_size: [8, 8, 8]
  embed_dim: 256

train:
  epochs: 100
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 1.0e-5
  workers: 12
  wandb_project: patch_icl # patch_icl  # set to null to disable W&B (offline-safe)
  run_name: null
  checkpoint: null  # path to a .pt checkpoint to resume from, e.g. results/vit_incontext_best.pt
  tpu: false        # set to true to run on Google Cloud TPU (requires torch_xla)
